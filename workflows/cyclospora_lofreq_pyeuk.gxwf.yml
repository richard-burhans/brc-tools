class: GalaxyWorkflow
label: Cyclospora typing (LoFreq/PyEuk arm)
doc: >-
  Genotype *Cyclospora cayetanensis* from Illumina amplicon reads and cluster the
  specimens into outbreaks, end to end.

  Paired FASTQ per specimen -> bwa mem against the 7-amplicon marker panel ->
  MAPQ>=20 + proper-pair filter -> two callers in parallel:
  per-PART haplotypes from the marker BAM, and the Mt-Junction repeat-length class
  straight from the reads -> one CDC HDS wide sheet -> PyEuk binary KING-wIBS
  distance + label-free clustering.

  Two things about the shape of this graph are deliberate and are not
  simplifications.

  1. The junction caller is fed the FASTQ, NOT the marker BAM. The Mt-Junction
  locus is not a contig in markers.fa, so junction-spanning reads never survive
  the MAPQ>=20 marker filter. Handed the BAM the caller returns
  NO_CALL / marker_absent for every specimen, which is indistinguishable from a
  real negative. Both callers still map over the same per-specimen collection,
  they just enter the graph at different points.

  2. markers.fa / parts.bed / haplotypes78.fa are workflow inputs, not the
  wrapper-bundled defaults, because markers.fa has to be *the same dataset* that
  bwa aligned against. parts.bed's coordinates only mean anything relative to the
  exact reference in the BAM header, and a one-base difference silently shifts
  every PART instead of erroring. Supplying one dataset to both steps removes the
  only mismatch the tool cannot detect for itself. The three files are a matched
  set: parts.bed column 4 keys the records in haplotypes78.fa, so they must be
  supplied together (the copies under
  tools/cyclospora/cyclospora_part_caller/refs/ are the validated trio).
  junction.fa is left bundled: no other step touches it, so no cross-step
  mismatch is possible.

  Gates are PRE-REGISTERED (see tools/cyclospora/THRESHOLD_PREREGISTRATION.md and
  pyeuk-bench/lofreq_arm/): a PART locus is called at >=50 spanning reads, a
  haplotype is kept at >=5% frequency AND >=10 reads. They are left at the tool
  defaults here on purpose. Do not tune them to improve a number.

  PyEuk is pinned to commit d8e45a81 (binary KING-wIBS). v3.x SNP-weighted
  distances were benchmarked on the same sheets and regress.
creator:
  - class: Person
    identifier: https://orcid.org/0000-0002-5987-8032
    name: Anton Nekrutenko
  - class: Person
    name: Claude Opus 5
license: MIT
release: "0.1"

inputs:
  reads:
    type: collection
    collection_type: list:paired
    doc: >-
      Adapter/quality-trimmed paired FASTQ, one pair per specimen. The list
      element identifier IS the specimen id: it becomes column 1 of both callers'
      output and the row id of the HDS sheet, so it must match [A-Za-z0-9_.-]+.
      The benchmark trimmed with fastp 0.23.4 --detect_adapter_for_pe
      --length_required 50; trimming is upstream of this workflow.
    position: {top: 0, left: 0}
  markers:
    type: data
    doc: >-
      markers.fa, the 7 amplicon reference sequences. Used twice, and on purpose
      by the same dataset: as the bwa mem reference and as the PART caller's
      contig/interval check.
    position: {top: 200, left: 0}
  parts:
    type: data
    doc: >-
      parts.bed. Column 4 names each ~100 bp PART and those names key
      haplotypes78.fa. Coordinates are relative to markers.fa.
    position: {top: 300, left: 0}
  known_haplotypes:
    type: data
    doc: >-
      haplotypes78.fa, the CDC nomenclature release. An exact sequence match names
      a haplotype; anything unmatched becomes <PART>_NOV_<md5[:6]>.
    position: {top: 400, left: 0}

outputs:
  filtered_bam:
    outputSource: filter_bam/outputsam
    doc: >-
      Per-specimen marker BAM, MAPQ>=20 + proper pairs. Coordinate sorted: bwa mem
      runs with output_sort=coordinate and samtools view preserves record order.
  part_calls:
    outputSource: part_caller/calls
    doc: Per-specimen long-format PART haplotype calls (10 columns).
  part_depth_summary:
    outputSource: part_caller/summary
    doc: >-
      Per-PART spanning depth and called flag. This is what disambiguates an empty
      locus block in the sheet: amplicon dropout, or called-but-all-haplotypes-gated.
  junction_calls:
    outputSource: junction_caller/junction
    doc: Per-specimen Mt-Junction repeat-length class from anchor-and-count.
  hds_sheet:
    outputSource: build_sheet/sheet
    doc: >-
      The CDC HDS wide sheet. Rows = specimens, columns = haplotype names,
      X = present, empty = absent. An ENTIRELY empty locus block means NOT CALLED
      and is the missing-data code PyEuk's dropout handling keys off.
  sheet_summary:
    outputSource: build_sheet/summary
    doc: Per-specimen count of empty locus blocks, for auditing the encoding above.
  distance_matrix:
    outputSource: pyeuk/distance_matrix
    doc: PyEuk revised binary KING-wIBS pairwise distance matrix.
  clusters:
    outputSource: pyeuk/clusters
    doc: Label-free clustering (no gold labels supplied; k chosen by PyEuk).

steps:
  map_reads:
    tool_id: toolshed.g2.bx.psu.edu/repos/devteam/bwa/bwa_mem/0.7.19+galaxy1
    label: map_reads
    doc: >-
      Map to the 7 marker amplicons. This is positional demultiplexing across
      markers, not an assembly; defaults (illumina preset, no read group) match
      the benchmark's `bwa mem -t N markers.fa t1 t2`. Sorted by coordinate here,
      which is why no separate index step exists: Galaxy builds the .bai as
      dataset metadata.
    in:
      reference_source|ref_file: markers
      fastq_input|fastq_input1: reads
    state:
      reference_source:
        reference_source_selector: history
        index_a: auto
      fastq_input:
        fastq_input_selector: paired_collection
        iset_stats: ''
      rg:
        rg_selector: do_not_set
      analysis_type:
        analysis_type_selector: illumina
      output_sort: coordinate
    out:
      bam_output: {}
    position: {top: 0, left: 300}

  filter_bam:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_view/samtools_view/1.22+galaxy2
    label: filter_bam
    doc: >-
      The benchmark's `samtools view -b -q 20 -f 2 -F 3852`. -F 3852 is
      4+8+256+512+1024+2048: unmapped, mate unmapped, secondary, QC fail,
      duplicate, supplementary. Reads that survive are the ones whose aligned
      subsequence over a PART is trustworthy.
    in:
      input: map_reads/bam_output
    state:
      mode:
        outtype: selected_reads
        filter_config:
          cond_region:
            select_region: 'no'
          cond_rg:
            select_rg: 'no'
          cond_expr:
            select_expr: 'no'
          quality: 20
          inclusive_filter: ['2']
          exclusive_filter: ['4', '8', '256', '512', '1024', '2048']
        subsample_config:
          subsampling_mode:
            select_subsample: fraction
            factor: 1.0
        output_options:
          reads_report_type: retained
          complementary_output: false
          output_format:
            oformat: bam
      addref_cond:
        addref_select: 'no'
    out:
      outputsam: {}
    position: {top: 0, left: 620}


  part_caller:
    tool_id: cyclospora_part_caller
    label: part_caller
    doc: >-
      Stage 3a. Per PART, take the aligned subsequence of every spanning read and
      collapse identical strings. No assembly. Specimen id left blank so the tool
      uses the collection element identifier. Gates at their pre-registered
      defaults (min_span 50, min_freq 0.05, min_reads 10).
    in:
      input: filter_bam/outputsam
      reference|markers: markers
      reference|parts: parts
      reference|known: known_haplotypes
    state:
      specimen: ''
      reference:
        source: history
      gates:
        min_span: 50
        min_freq: 0.05
        min_reads: 10
      emit_summary: true
    out:
      calls: {}
      summary: {}
    position: {top: 0, left: 1260}

  junction_caller:
    tool_id: cyclospora_junction_caller
    label: junction_caller
    doc: >-
      Stage 3b, the 8th CDC marker. Anchor-and-count: find the 64 nt left and
      45 nt right constant flanks in ONE read and count 15 nt units in between.
      No assembler; only 3-15 fragments span the array because Tn5 cuts inside the
      AT-rich repeat. Fed the FASTQ, not the BAM, for the reason in the workflow
      doc. emit_specimen_column stays on: the sheet builder cannot recover the id
      from a Galaxy dataset path.
    in:
      reads|fastq_collection: reads
    state:
      reads:
        reads_source: fastq_collection
      specimen_name: ''
      reference:
        ref_source: bundled
      min_reads: 3
      min_freq: 0.05
      emit_specimen_column: true
      emit_diag: false
    out:
      junction: {}
    position: {top: 420, left: 1260}

  merge_calls:
    tool_id: __MERGE_COLLECTION__
    label: merge_calls
    doc: >-
      One list for the sheet builder. The two collections carry the same element
      identifiers, so conflicts are suffixed rather than dropped; that is safe
      because the sheet builder takes the specimen id from each file's own
      `specimen` column and decides PART vs junction from the header line, never
      from the element name.
    in:
      inputs_0|input: part_caller/calls
      inputs_1|input: junction_caller/junction
    state:
      advanced:
        conflict:
          duplicate_options: suffix_conflict
          suffix_pattern: '_#'
    out:
      output: {}
    position: {top: 210, left: 1600}

  build_sheet:
    tool_id: cyclospora_build_sheet
    label: build_sheet
    doc: >-
      Stage 6. Novel haplotypes are KEPT (drop_novel off) - the with-novel sheet is
      the one the concordance and clustering numbers were measured on.
    in:
      calls: merge_calls/output
    state:
      drop_novel: false
      emit_summary: true
    out:
      sheet: {}
      summary: {}
    position: {top: 210, left: 1920}

  pyeuk:
    tool_id: cyclospora_pyeuk
    label: pyeuk
    doc: >-
      Stages 7-8. compute_revised_wibs_matrix then find_clusters(matrix, None):
      LABEL-FREE, no gold file. Supplying labels here would make the clustering a
      fit rather than a prediction.
    in:
      sheet: build_sheet/sheet
    state:
      calibration:
        mode: label_free
      advanced:
        min_completeness: 0.1
        k_min: 2
        k_max: 50
        report_excluded: true
    out:
      distance_matrix: {}
      clusters: {}
    position: {top: 210, left: 2240}
