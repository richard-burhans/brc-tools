class: GalaxyWorkflow
label: WF-A inventory (Phase A)
doc: >-
  Phase A inventory / QC. Sketch every assembly with sourmash, build an N x N
  similarity matrix (compare.csv; feeds WF-I fold order, sorted descending),
  and run BUSCO -m prot over the per-strain proteome collection. Collection
  element identifier = strain name throughout.
creator:
  - class: Person
    identifier: https://orcid.org/0000-0002-5987-8032
    name: Anton Nekrutenko
  - class: Person
    name: Claude Opus 4.8
license: MIT
release: "0.1"

inputs:
  assemblies:
    type: collection
    collection_type: list
    doc: >-
      Per-strain assembly FASTAs. Element identifier = strain name (e.g. PvP01).
      sourmash_sketch maps over this collection (one .sig per assembly).
    position: {top: 190, left: 0}
  proteomes:
    type: collection
    collection_type: list
    doc: >-
      Per-strain protein FASTAs (parallel to assemblies, keyed by strain).
      BUSCO runs -m prot, so it MUST map over proteins, not assemblies.
    position: {top: 380, left: 300}
  busco_lineage:
    type: string
    default: apicomplexa_odb12
    doc: >-
      BUSCO lineage dataset, species-configurable. ⛔ THE SUFFIX MUST MATCH THE CACHED DATABASE
      THE `busco` STEP RESOLVES AGAINST, and `_odb10` names are NOT valid under the one the tool
      now defaults to. usegalaxy.org 2026-09-03 offers all-odb12 (495 lineages, the tool default),
      all-odb10 (193) and v5 (67); `apicomplexa_odb10` appears only in the latter two, so the
      previous default could not be selected at all. ⚠ Names also changed between releases --
      odb10's `eudicots` is odb12's `eudicotyledons` -- so this is not a matter of editing the
      digits. For a non-Plasmodium panel pick the narrowest lineage that contains the organism:
      odb12 reaches order level for many clades (e.g. `rosales_odb12` for Cannabaceae) where
      odb10 stopped at `eudicots_odb10`.
    position: {top: 500, left: 300}
  anchor_gene_gff3s:
    type: collection
    collection_type: list
    doc: >-
      Curated gene GFF3 for each anchor, keyed by anchor name. A subset of the
      panel, so this collection is shorter than assemblies. anchor_prep derives
      the BED12 and the isoforms table from it, which WF-C2 needs.
    position: {top: 620, left: 300}
outputs:
  similarity_matrix:
    outputSource: sourmash_compare/output
    doc: N x N sourmash similarity matrix (compare.csv); feeds WF-I fold order.
  signatures:
    outputSource: sourmash_sketch/output
    doc: Per-strain sourmash signatures (.sig), BRC-reusable.
  busco_summaries:
    outputSource: busco/busco_sum
    doc: Per-strain BUSCO short summaries.
  sourmash_heatmap:
    outputSource: sourmash_compare/heatmap
    doc: Clustered sourmash similarity heatmap (PNG; hierarchical clustering).
  sourmash_dendrogram:
    outputSource: sourmash_compare/dendrogram
    doc: sourmash dendrogram (PNG).
  qc_report:
    outputSource: multiqc_report/html_report
    doc: MultiQC HTML — per-strain BUSCO completeness + the sourmash clustered heatmap & dendrogram.
  sizes:
    outputSource: panel_sizes/out_file1
    doc: Per-strain .sizes (chrom<TAB>length), derived from assemblies; consumed by WF-C.
  self_pairs:
    outputSource: panel_self_pairs/output
    doc: One X_X per strain (WF-C alignment-grid diagonal to exclude).
  relabel_map:
    outputSource: panel_relabel_map/output
    doc: A_B<TAB>A.B for every ordered pair (Phase E ids; WF-C relabel).
  anchor_bed12s:
    outputSource: anchor_prep/bed12
    doc: >-
      Per-anchor protein-coding BED12, transcript-keyed in column 4
      (WF-C2 triage/merge reference bed and TOGA2 --ref_annotation).
  anchor_isoforms:
    outputSource: anchor_prep/isoforms
    doc: >-
      Per-anchor gene<TAB>transcript table (TOGA2 --isoform_file). Derived from
      the same GFF3 as the BED12 in the same step, so the two cannot disagree
      on transcript ids.

steps:
  sourmash_sketch:
    tool_id: sourmash_sketch
    label: sourmash_sketch
    doc: >-
      sketch dna -p k=31,scaled=1000 (fixed in wrapper). Maps over the
      assemblies list collection; one signature per assembly, named after the
      element identifier (strain). Validated e2e 2026-06-07 against the
      locally-authored wrapper (tools/sourmash_sketch). The wrapper exposes a
      single data input `input` and a single output `output`; k/scaled are not
      exposed.
    in:
      input: assemblies
    # No state: the only input is the mapped-over `input`; k=31/scaled=1000 are
    # hardcoded in the wrapper command.
    position: {top: 810, left: 300}
  sourmash_compare:
    tool_id: sourmash_compare
    label: sourmash_compare
    doc: >-
      N x N similarity matrix (1.0 = identical) -> compare.csv. WF-I sorts
      descending (closest = highest similarity). Locally-authored wrapper
      (tools/sourmash_compare): takes a `list` collection `signatures` and an
      integer `ksize`; emits CSV via `--csv`. Validated e2e 2026-06-07.
    in:
      signatures: sourmash_sketch/output
    state:
      ksize: 31
    position: {top: 690, left: 600}
  busco:
    tool_id: busco
    label: busco
    doc: >-
      BUSCO -m prot -l <lineage>, mapping over the proteome collection
      (per strain). IUC tool.
    in:
      input: proteomes
      lineage|lineage_dataset: busco_lineage
    state:
      # Real IUC busco schema: mode is the test_param of the `busco_mode`
      # conditional, NOT a top-level `mode` key. Inputs must be proteomes
      # (-m prot); test_data ships only genomes.
      #
      # ⚠ THE LINEAGE SITUATION HAS CHANGED SINCE THIS COMMENT WAS WRITTEN. It
      # recorded (2026-06-07) that busco_database.loc was EMPTY, the fetch data
      # manager was absent, and select_lineage therefore could not run. On
      # usegalaxy.org as of 2026-09-03 that is no longer so: three cached
      # databases are installed (all-odb12 2026-03-20, all-odb10 2026-03-19, v5)
      # carrying 755 lineage options between them, and select_lineage works.
      #
      # ⛔ `cached_db` IS DELIBERATELY LEFT UNSET, AND THAT IS A CHOICE WORTH
      # SEEING. It is a top-level tool parameter naming WHICH cached database the
      # lineage select is filtered against, and it currently defaults to
      # all-odb12-2026-03-20-145944. Leaving it unset keeps this workflow
      # portable to instances holding a different set, but it also means the
      # lineage the run actually resolves depends on the server's default on the
      # day -- and a `busco_lineage` valid on one instance is unselectable on
      # another. Pinning it would trade that away for reproducibility; see the
      # PR discussion.
      busco_mode:
        mode: prot
      lineage:
        lineage_mode: select_lineage
      adv:
        evalue: 0.001
    position: {top: 480, left: 600}
  multiqc_report:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/multiqc/multiqc/1.35+galaxy1
    label: multiqc_report
    doc: >-
      One QC report: BUSCO completeness (busco module) + the sourmash clustered
      heatmap & dendrogram embedded via the image_content plugin. (The native
      MultiQC sourmash module exists in core 1.35 but is not yet exposed by the
      IUC wrapper — see tools-iuc PR galaxyproject/tools-iuc#8112, which adds it;
      once merged, this step can switch the sourmash inputs to the native
      `sourmash` software module instead of image_content.)
    in:
      results_0|software_cond|input: busco/busco_sum
      # image_content_input is a TOP-LEVEL multiqc param (not a software_cond
      # 'when'); the IUC 1.35+galaxy1 wrapper has no 'image_content' software
      # option. Connecting it under results_1|software_cond|... yields a broken,
      # unresolvable connection in the editor.
      image_content_input:
        - sourmash_compare/heatmap
        - sourmash_compare/dendrogram
    state:
      results:
        - software_cond:
            software: busco
    position: {top: 577, left: 978}

  # --- panel prep: reusable artifacts derived from the assemblies (for WF-C etc.) ---
  panel_self_pairs:
    tool_id: collection_self_pairs
    label: panel_self_pairs
    doc: One X_X per strain from the assemblies element identifiers.
    in:
      input: assemblies
    position: {top: 0, left: 300}
    post_job_actions:
      RenameDatasetActionoutput:
        action_arguments:
          newname: 'WF-C input: self_pairs'
        action_type: RenameDatasetAction
        output_name: output
      TagDatasetActionoutput:
        action_arguments:
          tags: name:wfc_self_pairs
        action_type: TagDatasetAction
        output_name: output
  panel_relabel_map:
    tool_id: collection_relabel_map
    label: panel_relabel_map
    doc: A_B->A.B relabel map from the assemblies element identifiers.
    in:
      input: assemblies
    position: {top: 620, left: 300}
    post_job_actions:
      RenameDatasetActionoutput:
        action_arguments:
          newname: 'WF-C input: relabel_map'
        action_type: RenameDatasetAction
        output_name: output
      TagDatasetActionoutput:
        action_arguments:
          tags: name:wfc_relabel_map
        action_type: TagDatasetAction
        output_name: output
  panel_faidx:
    tool_id: samtools_faidx
    label: panel_faidx
    doc: Index each assembly (.fai); maps over the assemblies collection. IUC samtools.
    in:
      input: assemblies
    position: {top: 190, left: 300}
  panel_sizes:
    tool_id: Cut1
    label: panel_sizes
    doc: chrom<TAB>length sizes = cut cols 1,2 of the .fai (no custom script).
    in:
      input: panel_faidx/output
    state:
      columnList: "c1,c2"
      delimiter: "T"
    position: {top: 190, left: 600}
    post_job_actions:
      RenameDatasetActionout_file1:
        action_arguments:
          newname: 'WF-C input: sizes'
        action_type: RenameDatasetAction
        output_name: out_file1
      TagDatasetActionout_file1:
        action_arguments:
          tags: name:wfc_sizes
        action_type: TagDatasetAction
        output_name: out_file1
  anchor_prep:
    tool_id: anchor_prep
    label: anchor_prep
    doc: >-
      Derives the two annotation artefacts WF-C2 needs from each anchor's GFF3:
      a protein-coding BED12 (gffread --bed, filtered) and a gene<TAB>transcript
      isoforms table (Parent/ID of every mRNA feature). Both come out of one
      call on one GFF3, which is what guarantees their transcript ids agree --
      TOGA2 cannot tie projections back to genes otherwise. Previously these
      were built outside Galaxy and staged by hand.
    in:
      input: anchor_gene_gff3s
    out:
      bed12: {}
      isoforms: {}
    position: {top: 620, left: 600}
    post_job_actions:
      RenameDatasetActionbed12:
        action_arguments:
          newname: 'WF-C2 input: anchor_bed12s'
        action_type: RenameDatasetAction
        output_name: bed12
      TagDatasetActionbed12:
        action_arguments:
          tags: name:wfc2_anchor_bed12
        action_type: TagDatasetAction
        output_name: bed12
      RenameDatasetActionisoforms:
        action_arguments:
          newname: 'WF-C2 input: anchor_isoforms'
        action_type: RenameDatasetAction
        output_name: isoforms
      TagDatasetActionisoforms:
        action_arguments:
          tags: name:wfc2_anchor_isoforms
        action_type: TagDatasetAction
        output_name: isoforms
