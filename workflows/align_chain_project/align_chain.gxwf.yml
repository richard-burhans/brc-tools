class: GalaxyWorkflow
label: WF-C align_chain (one-click, native collection ops)
license: MIT
creator:
  - class: Person
    identifier: https://orcid.org/0000-0002-5987-8032
    name: Anton Nekrutenko
  - class: Person
    name: Claude Opus 4.8
release: '0.3'
doc: >-
  Phase C, chaining half (split out of the former combined align_chain_project;
  the gene-projection half is now WF-C2 project_annotations). Whole-genome
  alignment -> reciprocal-best UCSC chains, as a SINGLE map-over with native
  Galaxy collection operations (no custom helpers). CROSS_PRODUCT_FLAT enumerates
  ordered strain pairs as two aligned target/query lists (the paired-slot ->
  two-input binding gxformat2 could not express), FILTER_FROM_FILE drops
  self-pairs, the cleaned + rbest UCSC chain pipeline maps over them, and
  RELABEL_FROM_FILE rewrites A_B->A.B for Phase E. Proven bit-identical to
  per-pair driving on the Pv4 test panel.
inputs:
  masked_fastas:
    type: collection
    collection_type: list
    doc: softmasked per-strain FASTAs (WF-B), id=strain
    position: {top: 142, left: 17}
  sizes:
    type: collection
    collection_type: list
    doc: per-strain .sizes (WF-A), id=strain
    position: {top: 537, left: 0}
  self_pairs:
    type: data
    doc: txt of self-pair ids (X_X) to exclude (WF-A)
    position: {top: 262, left: 4}
  relabel_map:
    type: data
    doc: tabular A_B<TAB>A.B id map for Phase E (WF-A)
    position: {top: 391, left: 5}
steps:
  xprod_fa:
    tool_id: __CROSS_PRODUCT_FLAT__
    in:
      input_a: masked_fastas
      input_b: masked_fastas
    out:
      output_a: {}
      output_b: {}
    position: {top: 320, left: 251}
  xprod_sz:
    tool_id: __CROSS_PRODUCT_FLAT__
    in:
      input_a: sizes
      input_b: sizes
    out:
      output_a: {}
      output_b: {}
    position: {top: 320, left: 1651}
  tgt_fa:
    tool_id: __FILTER_FROM_FILE__
    in:
      input: xprod_fa/output_a
      how|filter_source: self_pairs
    state:
      how:
        how_filter: remove_if_present
    out:
      output_filtered: {}
    position: {top: 90, left: 601}
  qry_fa:
    tool_id: __FILTER_FROM_FILE__
    in:
      input: xprod_fa/output_b
      how|filter_source: self_pairs
    state:
      how:
        how_filter: remove_if_present
    out:
      output_filtered: {}
    position: {top: 340, left: 601}
  tgt_sz:
    tool_id: __FILTER_FROM_FILE__
    in:
      input: xprod_sz/output_a
      how|filter_source: self_pairs
    state:
      how:
        how_filter: remove_if_present
    out:
      output_filtered: {}
    position: {top: 320, left: 2001}
  qry_sz:
    tool_id: __FILTER_FROM_FILE__
    in:
      input: xprod_sz/output_b
      how|filter_source: self_pairs
    state:
      how:
        how_filter: remove_if_present
    out:
      output_filtered: {}
    position: {top: 570, left: 2001}
  kegalign:
    tool_id: toolshed.g2.bx.psu.edu/repos/richard-burhans/kegalign/kegalign/0.1.2.9+galaxy1
    in:
      target: tgt_fa/output_filtered
      query: qry_fa/output_filtered
    state:
      sequence_options:
        strand_selector: both
      ungapped_extension_options:
        hspthresh: 5000
      gapped_extension_options:
        gappedthresh: 6000
        ydrop: 15000
      interpolation_options:
        inner: 2000
      output_options:
        format:
          format_selector: axt
          axt_type: axt
    out:
      kegalign_output: {}
    position: {top: 140, left: 901}
  batched_lastz:
    tool_id: toolshed.g2.bx.psu.edu/repos/richard-burhans/batched_lastz/batched_lastz/1.04.22+galaxy1
    in:
      input: kegalign/kegalign_output
    # batched_lastz declares its output format as 'auto' (sniffed at runtime);
    # axtchain in_aln only accepts axt/psl, so the editor shows the connection as
    # an unverifiable (orange) line. kegalign is configured format=axt, so pin the
    # datatype to axt -> the editor draws a solid, valid connection.
    out:
      output: {}
    position: {top: 140, left: 1201}
    post_job_actions:
      ChangeDatatypeActionoutput:
        action_arguments:
          newtype: axt
        action_type: ChangeDatatypeAction
        output_name: output
  axtchain:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/ucsc_axtchain/ucsc_axtchain/482+galaxy2
    in:
      in_aln: batched_lastz/output
      in_target: tgt_fa/output_filtered
      in_query: qry_fa/output_filtered
    state:
      linear_gap_options:
        linear_gap: loose
    out:
      out: {}
    position: {top: 80, left: 1651}
  chainsort_clean:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/ucsc_chainsort/ucsc_chainsort/482+galaxy0
    in:
      in_chain: axtchain/out
    out:
      out: {}
    position: {top: 0, left: 2001}
  chainprenet:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/ucsc_chainprenet/ucsc_chainprenet/482+galaxy0
    in:
      in_chain: chainsort_clean/out
      target_reference_index_source|in_tar_ref_index: tgt_sz/output_filtered
      query_reference_index_source|in_que_ref_index: qry_sz/output_filtered
    state:
      target_reference_index_source:
        target_reference_index_source_selector: history
      query_reference_index_source:
        query_reference_index_source_selector: history
    out:
      out: {}
    position: {top: 0, left: 2351}
  chainnet:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/ucsc_chainnet/ucsc_chainnet/482+galaxy0
    in:
      in_chain: chainprenet/out
      target_reference_index_source|in_tar_ref_index: tgt_sz/output_filtered
      query_reference_index_source|in_que_ref_index: qry_sz/output_filtered
    state:
      target_reference_index_source:
        target_reference_index_source_selector: history
      query_reference_index_source:
        query_reference_index_source_selector: history
    out:
      targetNet: {}
    position: {top: 0, left: 2751}
  netchainsubset:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/ucsc_netchainsubset/ucsc_netchainsubset/482+galaxy0
    in:
      in_net: chainnet/targetNet
      in_chain: chainprenet/out
    out:
      out: {}
    position: {top: 0, left: 3051}
  chainstitchid_clean:
    tool_id: chainStitchId
    in:
      input: netchainsubset/out
    out:
      output: {}
    position: {top: 150, left: 3351}
  rb_swap1:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/ucsc_chainswap/ucsc_chainswap/482+galaxy0
    in:
      in_chain: chainstitchid_clean/output
    out:
      out: {}
    position: {top: 150, left: 3651}
  rb_sort1:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/ucsc_chainsort/ucsc_chainsort/482+galaxy0
    in:
      in_chain: rb_swap1/out
    out:
      out: {}
    position: {top: 170, left: 3951}
  rb_net:
    # ⚠ DELIBERATELY NOT UCSC's RECIPE. `doRecipBest.pl` runs `chainPreNet | chainNet -minSpace=1
    # -minScore=0 | netSyntenic`; this runs chainNet alone on its defaults (minScore 2000). Measured
    # on Finola chr1 vs Purple Kush chr1, a 10 Mb slice: chainPreNet changes NOTHING (identical
    # chains and bases with and without it), and UCSC's flags add 9x the chain records for 2.56%
    # more aligned sequence, all of it in fragments under 100 bp -- chains >= 1 kb go 812 -> 813,
    # chains >= 10 kb 44 -> 44. See the fuller note on the same step in `align_chain_udt.gxwf.yml`,
    # including what the measurement does not cover.
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/ucsc_chainnet/ucsc_chainnet/482+galaxy0
    in:
      in_chain: rb_sort1/out
      target_reference_index_source|in_tar_ref_index: qry_sz/output_filtered
      query_reference_index_source|in_que_ref_index: tgt_sz/output_filtered
    state:
      target_reference_index_source:
        target_reference_index_source_selector: history
      query_reference_index_source:
        query_reference_index_source_selector: history
    out:
      targetNet: {}
    position: {top: 280, left: 4251}
  rb_subset:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/ucsc_netchainsubset/ucsc_netchainsubset/482+galaxy0
    in:
      in_net: rb_net/targetNet
      in_chain: rb_sort1/out
    out:
      out: {}
    position: {top: 280, left: 4551}
  rb_stitch:
    tool_id: chainStitchId
    in:
      input: rb_subset/out
    out:
      output: {}
    position: {top: 280, left: 4851}
  rb_swap2:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/ucsc_chainswap/ucsc_chainswap/482+galaxy0
    in:
      in_chain: rb_stitch/output
    out:
      out: {}
    position: {top: 280, left: 5151}
  rb_sort2:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/ucsc_chainsort/ucsc_chainsort/482+galaxy0
    in:
      in_chain: rb_swap2/out
    out:
      out: {}
    position: {top: 280, left: 5451}
  relabel_cleaned:
    tool_id: __RELABEL_FROM_FILE__
    in:
      input: chainstitchid_clean/output
      how|labels: relabel_map
    state:
      how:
        how_select: tabular
        strict: false
    out:
      output: {}
    position: {top: 370, left: 3651}
  relabel_rbest:
    tool_id: __RELABEL_FROM_FILE__
    in:
      input: rb_sort2/out
      how|labels: relabel_map
    state:
      how:
        how_select: tabular
        strict: false
    out:
      output: {}
    position: {top: 280, left: 5751}
outputs:
  cleaned_chains:
    outputSource: relabel_cleaned/output
  rbest_chains:
    outputSource: relabel_rbest/output
  pairwise_axt:
    outputSource: batched_lastz/output
