class: GalaxyWorkflow
label: WF-C2 project_annotations (UDT edition, usegalaxy.org)
license: MIT
creator:
  - class: Person
    identifier: https://orcid.org/0000-0002-5987-8032
    name: Anton Nekrutenko
  - class: Person
    identifier: https://orcid.org/0009-0006-5949-0958
    name: Richard Burhans
  - class: Person
    name: Claude Opus 4.8
release: "0.1"
# ⛔ THE TOP-LEVEL `doc:` IS SIZE-LIMITED IN PRACTICE, AND THIS FILE FOUND THE LIMIT THE HARD WAY.
# As first committed its `doc:` was 4001 characters and `POST /api/workflows` answered
# `500 Uncaught exception in exposed API method` on usegalaxy.org and on vgp.usegalaxy.org --
# deterministically, six times out of six -- while a local Galaxy 25.0 accepted the same bytes.
# Bisected: the first failing prefix is 3866 characters; 3865 imports. The same file with a short
# `doc:` imports cleanly with every step resolving, and stripping the step and port docs does NOT
# help, so it is the top-level string alone. It is not raw length either -- a synthetic 4200-char
# doc of ordinary words imports, and 6000 characters of ONE repeated word imports while 6000
# characters of distinct words does not -- so the ceiling depends on vocabulary, presumably through
# whatever text index the annotation feeds. Whatever the mechanism, the consequence is flat: a
# workflow whose doc is too long CANNOT BE IMPORTED on the server this port exists for, and
# `run_udt_workflow.py` dies on its first API call. `check_workflow_ports.py --import-check` now
# makes that POST for real.
#
# So the long-form rationale lives in comments from here down. Comments are not part of the
# imported workflow; `doc:` is. Everything a Galaxy USER needs stays in `doc:` -- including the
# name of every input this edition drops, because the parity check reads that string.
#
# WHY THIS IS THE LIFTOFF-ONLY PASS. A User-Defined Tool is a container plus a command, so it can
# only wrap an image a Galaxy can PULL. tools/toga2/macros.xml records that upstream hillerlab/TOGA2
# ships only an apptainer/Singularity def -- no published Docker image, no bioconda package, no
# biocontainer -- and that this project builds its own SIF onto shared storage at
# /data/containers/toga2-2.0.8.sif. A local .sif path is not something usegalaxy.org can resolve.
# Until an upstream image exists the TOGA2/CESAR2 rescue cannot run there by ANY means, so the
# rescue branch is dropped outright rather than wired to a tool that cannot start: nine steps go,
# and with them three inputs. Both OUTPUTS are unchanged, because brc-phase-c4-merge produces
# exactly what the classic's merge produces with an empty TOGA directory -- every projected gene
# tagged source=liftoff, every reference gene absent from the projection reported source=none,
# intactness=M. That is the pass the classic's own doc describes ("Liftoff-only; TOGA2 off") and is
# not what the classic actually runs.
#
# THE RESCUE HALF IS BUILT AND WAITING. `brc-anchor-grid` is in this repository although this
# workflow does not use it: it bridges WF-C's {target}.{query} chains to this grid's
# {anchor}_{query} cells, and it is the only other tool a pass-2 edition needs. That edition adds
# TEN steps, not nine -- brc-anchor-grid takes anchor AND strain identifier files, so it also needs
# a second `collection_element_identifiers` over `assemblies`.
#
# TWO THRESHOLDS TRAVEL BADLY. `subtelomere_bp: 100000` flags any gene within 100 kb of a sequence
# END, so a gene escapes rule R7 only on a sequence longer than 200 kb. On an assembly whose N50 is
# below that, most genes are routed to a CESAR2 fallback this edition does not run,
# liftoff_clean.gff3 comes out comments-only, and the merge reports every reference gene as
# source=none, intactness=M with a green invocation -- a real result shape, not a crash. Read
# `triage_summary` before believing an annotation count. `core_identity_min: 0.95` is likewise a
# within-species number. The panel this repository targets is chromosome-level.
#
# `query_name` IS THE LITERAL STRING `query` FOR EVERY CELL and is written into summary.json (and
# into a comment line of annotation.gff3). A per-element scalar derived from a map-over identifier
# is not expressible in gxformat2, so each cell's artifacts are attributable only by their
# collection element identifier. The classic has the same limitation.
#
# `join_identifier: '_'` IS SET EXPLICITLY on all three cross products. The default is already `_`,
# so nothing about the run changes -- but this project's renderer refuses on Galaxy's "No value
# found for X. Using default" upgrade messages, because allow_tool_state_corrections downgrades a
# refusal to a server-side log line no API response exposes. WF-C's UDT edition sets it for the
# same reason. (run_udt_workflow's fill_step_defaults would also supply it, since __CROSS_PRODUCT_FLAT__
# is a stock tool it can resolve; it CANNOT resolve a brc-* UDT, which is why the UDT steps below
# name their optional inputs explicitly instead.)
doc: >-
  WF-C2 ported to run on usegalaxy.org, as the Liftoff-only pass. Five of the classic workflow's
  twenty-one steps name tools that are not installed there -- collection_self_pairs,
  collection_anchor_grid, phase_c2_triage, toga2 and phase_c4_merge -- so the classic imports and
  cannot be invoked. Four are replaced by User-Defined Tools; TOGA2 is not portable, because it has
  no published container image, so the TOGA2/CESAR2 rescue branch is dropped rather than wired to a
  tool that cannot start.

  Nine of the classic's steps are therefore absent, and with them three inputs: `anchor_masked`,
  `anchor_isoforms` and `cleaned_chains`, all three TOGA2-only. Both of the classic's OUTPUTS are
  unchanged, because the merge produces exactly what it produces with an empty TOGA directory.
  Three outputs are ADDED -- `triage_summary`, `triage_table` and Liftoff's `unmapped` -- because
  without them a run that projected nothing cannot be told from one that projected everything: the
  merged GFF3 is valid either way, and the classic publishes none of the numbers that would say
  which happened.

inputs:
  anchor_assemblies:
    type: collection
    collection_type: list
    doc: anchor unmasked FASTAs (Liftoff reference), id=anchor
    position: {top: 0, left: 0}
  anchor_gene_gff3s:
    type: collection
    collection_type: list
    doc: anchor gene.gff3 (Liftoff annotation), id=anchor
    position: {top: 10, left: 10}
  anchor_bed12s:
    type: collection
    collection_type: list
    doc: >-
      anchor BED12 (triage/merge reference gene set), id=anchor. WF-A's anchor_prep writes it, and
      column 4 is the GENE id -- the merge keys its reference set on that column.
    position: {top: 20, left: 20}
  assemblies:
    type: collection
    collection_type: list
    doc: query unmasked FASTAs (Liftoff target = query), id=strain
    position: {top: 30, left: 30}
  query_masked:
    type: collection
    collection_type: list
    doc: query softmasked FASTAs (triage --query-fasta; WF-B), id=strain
    position: {top: 40, left: 40}
steps:
  anchor_identifiers:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/collection_element_identifiers/collection_element_identifiers/0.0.3
    label: anchor_identifiers
    position: {top: 45, left: 45}
    doc: >-
      The anchor element identifiers as a text dataset. ⛔ NOT REDUNDANT WITH THE COLLECTION. A
      Galaxy job cannot read its input collection's identifiers, so the self-pair list -- which is
      pure bookkeeping over those names -- has to be handed them as data. The classic tool did this
      with Cheetah, which a UDT has no equivalent of. Stock IUC tool; it runs on .org.
    in:
      input_collection: anchor_assemblies
    out:
      output: {}
  gen_anchor_self_pairs:
    tool_id: brc-self-pairs
    label: gen_anchor_self_pairs
    position: {top: 50, left: 50}
    doc: >-
      The `A_A` cells to drop from the projection grid: an anchor does not need its own annotation
      projected onto itself. Identical output to `collection_self_pairs`, from the identifier file
      instead of from the collection.
    in:
      identifiers: anchor_identifiers/output
    out:
      output: {}
  p_grid_fa:
    tool_id: __CROSS_PRODUCT_FLAT__
    in:
      input_a: anchor_assemblies
      input_b: assemblies
    state:
      join_identifier: '_'
    out:
      output_a: {}
      output_b: {}
    position: {top: 60, left: 60}
  p_grid_gff:
    tool_id: __CROSS_PRODUCT_FLAT__
    in:
      input_a: anchor_gene_gff3s
      input_b: assemblies
    state:
      join_identifier: '_'
    out:
      output_a: {}
      output_b: {}
    position: {top: 70, left: 70}
  p_grid_bed:
    tool_id: __CROSS_PRODUCT_FLAT__
    in:
      input_a: anchor_bed12s
      input_b: query_masked
    state:
      join_identifier: '_'
    out:
      output_a: {}
      output_b: {}
    position: {top: 80, left: 80}
  p_anc_fa:
    tool_id: __FILTER_FROM_FILE__
    in:
      input: p_grid_fa/output_a
      how|filter_source: gen_anchor_self_pairs/output
    state:
      how:
        how_filter: remove_if_present
    out:
      output_filtered: {}
    position: {top: 90, left: 90}
  p_qry_fa:
    tool_id: __FILTER_FROM_FILE__
    in:
      input: p_grid_fa/output_b
      how|filter_source: gen_anchor_self_pairs/output
    state:
      how:
        how_filter: remove_if_present
    out:
      output_filtered: {}
    position: {top: 100, left: 100}
  p_anc_gff:
    tool_id: __FILTER_FROM_FILE__
    in:
      input: p_grid_gff/output_a
      how|filter_source: gen_anchor_self_pairs/output
    state:
      how:
        how_filter: remove_if_present
    out:
      output_filtered: {}
    position: {top: 110, left: 110}
  p_anc_bed:
    tool_id: __FILTER_FROM_FILE__
    in:
      input: p_grid_bed/output_a
      how|filter_source: gen_anchor_self_pairs/output
    state:
      how:
        how_filter: remove_if_present
    out:
      output_filtered: {}
    position: {top: 120, left: 120}
  p_qry_masked:
    tool_id: __FILTER_FROM_FILE__
    in:
      input: p_grid_bed/output_b
      how|filter_source: gen_anchor_self_pairs/output
    state:
      how:
        how_filter: remove_if_present
    out:
      output_filtered: {}
    position: {top: 130, left: 130}
  p_liftoff:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/liftoff/liftoff/1.6.3+galaxy0
    in:
      target_fasta: p_qry_fa/output_filtered
      reference_fasta: p_anc_fa/output_filtered
      annotation: p_anc_gff/output_filtered
    state:
      chromosome_mapping:
        copy_detection:
          # ⛔ QUOTED, BECAUSE `find_copies` IS A SELECT AND NOT A BOOLEAN. Its legal values are the
          # STRINGS 'false'/'true' (live schema: SelectToolParameter, options No/false, Yes/true),
          # and `basic.py`'s `if value in legal_values` tests Python True against {'false','true'}
          # and then against the option labels, and rejects it. Measured by importing the classic
          # file to usegalaxy.org and exporting the native workflow back: with the bare boolean the
          # stored state is `{"chromosome_mapping": {"copy_detection": {"find_copies": true}}}` --
          # no `__current_case__`, no `__page__`, and NO `copy_min_identity`. The conditional never
          # resolved, so the 0.95 threshold is silently gone and `-copies` is never passed at all.
          # The two Liftoff knobs this workflow actually chooses are the two that do not survive
          # import. With the quotes: `{"find_copies": "true", "__current_case__": 1,
          # "copy_min_identity": "0.95"}`.
          find_copies: 'true'
          copy_min_identity: 0.95
    out:
      liftoff_gff: {}
      unmapped: {}
    position: {top: 140, left: 140}
  p_triage:
    tool_id: brc-phase-c2-triage
    label: p_triage
    in:
      liftoff_gff: p_liftoff/liftoff_gff
      query_fasta: p_qry_masked/output_filtered
      reference_bed: p_anc_bed/output_filtered
    state:
      query_name: query
      core_identity_min: 0.95
      core_coverage_min: 0.9
      family_identity_min: 0.85
      subtelomere_bp: 100000
    out:
      triage_tsv: {}
      needs_cesar2_bed: {}
      liftoff_clean_gff3: {}
      summary_json: {}
    position: {top: 150, left: 150}
  p_merge:
    tool_id: brc-phase-c4-merge
    label: p_merge
    doc: >-
      Liftoff-only: no TOGA2 inputs are connected, so every projected gene is tagged
      `source=liftoff` and a reference gene absent from the projection is reported `source=none,
      intactness=M`. The UDT refuses a HALF-supplied TOGA pair rather than silently producing this
      same answer while looking like a rescue.
    in:
      liftoff_clean: p_triage/liftoff_clean_gff3
      ref_bed: p_anc_bed/output_filtered
    state:
      query: query
    out:
      annotation_gff3: {}
      classification_tsv: {}
    position: {top: 250, left: 250}
outputs:
  merged_annotations:
    outputSource: p_merge/annotation_gff3
  classifications:
    outputSource: p_merge/classification_tsv
  # ⛔ THREE OUTPUTS THE CLASSIC PRODUCES AND PUBLISHES NOTHING OF, ADDED BECAUSE WITHOUT THEM A
  # RUN CANNOT BE TOLD FROM AN EMPTY ONE. `merged_annotations` is a syntactically valid GFF3 whether
  # it holds every gene or none: if triage rejects everything, `liftoff_clean.gff3` is comments only,
  # the merge writes every reference gene as `source=none, intactness=M`, both outputs appear, and
  # the invocation is green. The numbers that would expose that are all in datasets the classic
  # leaves unpublished -- `summary.json` carries the fallback rate, `triage.tsv` the per-gene rule
  # trace, and Liftoff's `unmapped` is the only record of what failed to project at all.
  triage_summary:
    outputSource: p_triage/summary_json
    doc: Per-cell counts and the CESAR2 fallback rate. Read this before quoting an annotation count.
  triage_table:
    outputSource: p_triage/triage_tsv
    doc: Per-gene rule trace -- which rule flagged each gene, and with what identity and coverage.
  liftoff_unmapped:
    outputSource: p_liftoff/unmapped
    doc: >-
      Reference features Liftoff could not place at all. Absent from every other output, including
      the classification table, which only reports genes the reference BED12 knows about.
