class: GalaxyWorkflow
label: Low-complexity and tandem repeat soft-masking
doc: >-
  This workflow soft-masks a list of genome assemblies. It runs four detectors of
  low-complexity, tandem and over-represented sequence: NCBI dustmasker, NCBI
  WindowMasker, tantan and FasTAN. It first removes any soft-masking already present. Then
  bedtools maskfasta (-soft) lower-cases the union of the four interval sets in each
  assembly, and samtools faidx indexes the result. The workflow also outputs one BED
  interval track for each detector (BED6, except BED4 for WindowMasker). It also
  outputs a table of the percentage of each assembly that each detector and their
  union mask. The workflow keeps the collection element identifiers (one for each
  assembly) throughout.
creator:
  - class: Person
    identifier: https://orcid.org/0000-0002-5987-8032
    name: Anton Nekrutenko
  - class: Person
    identifier: https://orcid.org/0009-0006-5949-0958
    name: Richard Burhans
license: MIT
release: "0.1"

inputs:
  Genome assemblies:
    type: collection
    collection_type: list
    doc: >-
      A list collection of genome assembly FASTA files, with one element for each
      assembly. The element identifier (for example, a strain name) labels each
      per-assembly output and its row in the percent-masked table.
    position: {top: 170, left: 0}
outputs:
  Soft-masked assemblies:
    outputSource: maskfasta/output
    doc: >-
      Soft-masked FASTA for each assembly. The union of all four detectors is lower-cased.
  Soft-masked assembly index:
    outputSource: faidx/output
    doc: >-
      The samtools faidx index (.fai) of the soft-masked FASTA for each assembly.
  dustmasker intervals:
    outputSource: dustmasker/output
    doc: >-
      dustmasker low-complexity intervals for each assembly (BED6). You can use them as a
      UCSC hub track.
  WindowMasker intervals:
    outputSource: windowmasker/mask_output
    doc: >-
      WindowMasker over-represented-sequence intervals for each assembly (BED4). You can
      use them as a UCSC hub track.
  tantan intervals:
    outputSource: tantan/output
    doc: >-
      tantan low-complexity intervals for each assembly (BED6). You can use them as a UCSC
      hub track.
  FasTAN intervals:
    outputSource: fastan/output
    doc: >-
      FasTAN tandem-array intervals for each assembly (BED6). You can use them as a UCSC
      hub track.
  Percent masked table:
    outputSource: masking_table/output
    doc: >-
      Table of the percent of the genome that is masked. It has one row for each assembly
      and one column for each detector plus the union. masking_table pivots the bedtools
      genomecov results into this table.

steps:
  uppercase:
    tool_id: toolshed.g2.bx.psu.edu/repos/richard-burhans/seqtk/seqtk_seq/1.5+galaxy2
    label: uppercase
    doc: >-
      Remove any soft-masking that the assembly already has (seqtk seq -U). Thus the
      output of this workflow carries the mask of this workflow and nothing else. Each
      masker already upper-cases its own working copy, so the BED tracks are de novo.
      maskfasta does not upper-case its input, and this step fixes that.
    in:
      in_file: Genome assemblies
    state:
      q: 0
      X: 255
      n: ''
      l: 0
      Q: 33
      s: 11
      f: 1.0
      L: 0
      c: false
      direction: forward
      A: false
      C: false
      N: false
      U: true
      x1: false
      x2: false
    position: {top: 170, left: 150}
  dustmasker:
    tool_id: toolshed.g2.bx.psu.edu/repos/richard-burhans/dustmasker/dustmasker/2.17.0+galaxy0
    label: dustmasker
    doc: >-
      NCBI DUST finds low-complexity intervals and writes them as content-annotated BED6.
      The step maps over assemblies.
    in:
      input: uppercase/default
    position: {top: 0, left: 300}
    post_job_actions:
      RenameDatasetActionoutput:
        action_arguments:
          newname: 'hub track: dustmasker LC (BED6)'
        action_type: RenameDatasetAction
        output_name: output
      TagDatasetActionoutput:
        action_arguments:
          tags: DustMasker
        action_type: TagDatasetAction
        output_name: output
  windowmasker_mkcounts:
    tool_id: toolshed.g2.bx.psu.edu/repos/richard-burhans/windowmasker/windowmasker_mkcounts/2.17.0+galaxy1
    label: windowmasker_mkcounts
    doc: >-
      NCBI WindowMasker mk_counts counts the k-mer units of each assembly. The ustat step
      uses these counts. The step maps over assemblies.
    in:
      fasta_input: uppercase/default
    position: {top: 220, left: 300}
  windowmasker:
    tool_id: toolshed.g2.bx.psu.edu/repos/richard-burhans/windowmasker/windowmasker_ustat/2.17.0+galaxy1
    label: windowmasker
    doc: >-
      NCBI WindowMasker ustat uses the unit counts to find genome-frequency repeats and
      writes them as BED. DUST is off, because dustmasker runs as its own detector. The step
      maps over assemblies.
    in:
      fasta_input: uppercase/default
      mkcount_input: windowmasker_mkcounts/mkcount_output
    state:
      output_format: interval
      use_dust:
        use_dust_selector: "no"
    position: {top: 220, left: 480}
    post_job_actions:
      RenameDatasetActionmask_output:
        action_arguments:
          newname: 'hub track: windowmasker repeats (BED)'
        action_type: RenameDatasetAction
        output_name: mask_output
      TagDatasetActionmask_output:
        action_arguments:
          tags: WindowMasker
        action_type: TagDatasetAction
        output_name: mask_output
  tantan:
    tool_id: toolshed.g2.bx.psu.edu/repos/richard-burhans/tantan/tantan/51+galaxy0
    label: tantan
    doc: >-
      tantan finds gentle low-complexity intervals and writes them as BED6. The step maps
      over assemblies.
    in:
      input: uppercase/default
    position: {top: 660, left: 300}
    post_job_actions:
      RenameDatasetActionoutput:
        action_arguments:
          newname: 'hub track: tantan LC (BED6)'
        action_type: RenameDatasetAction
        output_name: output
      TagDatasetActionoutput:
        action_arguments:
          tags: TanTan
        action_type: TagDatasetAction
        output_name: output
  fastan:
    tool_id: toolshed.g2.bx.psu.edu/repos/richard-burhans/fastan/fastan/0.8+galaxy0
    label: fastan
    doc: >-
      FASTAN finds tandem arrays and writes them as BED6. The step maps over assemblies.
    in:
      input: uppercase/default
    position: {top: 830, left: 300}
    post_job_actions:
      RenameDatasetActionoutput:
        action_arguments:
          newname: 'hub track: fastan tandem (BED6)'
        action_type: RenameDatasetAction
        output_name: output
      TagDatasetActionoutput:
        action_arguments:
          tags: fastan
        action_type: TagDatasetAction
        output_name: output
  union_cat:
    tool_id: cat1
    label: union_cat
    doc: >-
      Concatenate the four per-strain BED interval sets into one set before sort and
      merge. Merge uses only the first three columns. Galaxy zips the sets by element identifier. This step uses a Galaxy distro
      tool.
    in:
      input1: dustmasker/output
      queries_0|input2: windowmasker/mask_output
      queries_1|input2: tantan/output
      queries_2|input2: fastan/output
    position: {top: 420, left: 650}
    state:
      queries:
        - input2:
            __class__: ConnectedValue
        - input2:
            __class__: ConnectedValue
        - input2:
            __class__: ConnectedValue
  faidx_ref:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_faidx/samtools_faidx/1.22+galaxy1
    label: faidx_ref
    doc: >-
      Index the upper-cased FASTA (.fai). The index supplies contig sizes to sort_bed and
      genomecov.
    in:
      input: uppercase/default
    position: {top: 420, left: 300}
  sizes_cut:
    tool_id: toolshed.g2.bx.psu.edu/repos/bgruening/text_processing/tp_cut_tool/9.11+galaxy0
    label: sizes_cut
    doc: >-
      Cut chrom<TAB>length from each upper-cased .fai. The result is the bedtools genome
      file. The step maps over faidx_ref.
    in:
      input: faidx_ref/output
    state:
      complement: ""
      cut_type_options:
        cut_element: "-f"
        delimiter: ""
        colnames_option:
          header: "N"
          list: [1, 2]
    position: {top: 420, left: 650}
  sort_bed:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bedtools/bedtools_sortbed/2.31.1+galaxy0
    label: sort_bed
    doc: >-
      Sort the concatenated intervals, because merge needs sorted input. This step uses
      IUC bedtools.
    in:
      input: union_cat/out_file1
      genome_file_opts|genome: sizes_cut/output
    state:
      option: ''
      genome_file_opts:
        genome_file_opts_selector: hist
    position: {top: 420, left: 950}
  merge_bed:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bedtools/bedtools_mergebed/2.31.1+galaxy2
    label: merge_bed
    doc: >-
      Merge overlapping intervals from all four maskers into their union. This step uses
      IUC bedtools.
    in:
      input: sort_bed/output
    state:
      strand: ''
      distance: 0
      header: false
      c_and_o_argument_repeat: []
    position: {top: 420, left: 1250}
  maskfasta:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bedtools/bedtools_maskfastabed/2.31.1
    label: maskfasta
    doc: >-
      Soft-mask the UPPER-CASED assembly at the merged union intervals (-soft). This step
      uses IUC bedtools. The fasta input is the upper-cased assembly and the bed input is
      the merged union, both per strain. Galaxy zips them by strain. The step reads
      `uppercase/default` rather than `assemblies`. Thus the published FASTA carries only
      the mask of this workflow, not its union with the mask that the assembly already
      had.
    in:
      fasta: uppercase/default
      input: merge_bed/output
    state:
      soft: true
      mc: 'N'
      fullheader: false
    position: {top: 270, left: 1600}
    post_job_actions:
      RenameDatasetActionoutput:
        action_arguments:
          newname: softmasked FASTA
        action_type: RenameDatasetAction
        output_name: output
      TagDatasetActionoutput:
        action_arguments:
          tags: SoftmaskedFasta
        action_type: TagDatasetAction
        output_name: output
  faidx:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/samtools_faidx/samtools_faidx/1.22+galaxy1
    label: faidx
    doc: >-
      Index the soft-masked FASTA (.fai). This step uses IUC samtools_faidx.
    in:
      input: maskfasta/output
    position: {top: 270, left: 1900}
    post_job_actions:
      RenameDatasetActionoutput:
        action_arguments:
          newname: softmasked FASTA index (.fai)
        action_type: RenameDatasetAction
        output_name: output
      TagDatasetActionoutput:
        action_arguments:
          tags: Softmaskedfai
        action_type: TagDatasetAction
        output_name: output
  gcov_dust:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bedtools/bedtools_genomecoveragebed/2.31.1
    label: gcov_dust
    doc: >-
      Compute a genome coverage histogram (max depth 1) of the dustmasker intervals. The
      step maps over strains.
    in:
      input_type|input: dustmasker/output
      input_type|genome_file_opts|genome: sizes_cut/output
    state:
      input_type:
        input_type_select: bed
        genome_file_opts:
          genome_file_opts_selector: hist
      report:
        report_select: hist
        max: 1
      split: false
      strand: ''
      d: false
      dz: false
      five: false
      three: false
    position: {top: 0, left: 2550}
  gcov_window:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bedtools/bedtools_genomecoveragebed/2.31.1
    label: gcov_window
    doc: >-
      Compute the genome coverage (max depth 1) of the windowmasker intervals. The step
      maps over strains.
    in:
      input_type|input: windowmasker/mask_output
      input_type|genome_file_opts|genome: sizes_cut/output
    state:
      input_type:
        input_type_select: bed
        genome_file_opts:
          genome_file_opts_selector: hist
      report:
        report_select: hist
        max: 1
      split: false
      strand: ''
      d: false
      dz: false
      five: false
      three: false
    position: {top: 220, left: 2550}
  gcov_tantan:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bedtools/bedtools_genomecoveragebed/2.31.1
    label: gcov_tantan
    doc: >-
      Compute the genome coverage (max depth 1) of the tantan intervals. The step maps
      over strains.
    in:
      input_type|input: tantan/output
      input_type|genome_file_opts|genome: sizes_cut/output
    state:
      input_type:
        input_type_select: bed
        genome_file_opts:
          genome_file_opts_selector: hist
      report:
        report_select: hist
        max: 1
      split: false
      strand: ''
      d: false
      dz: false
      five: false
      three: false
    position: {top: 660, left: 2550}
  gcov_fastan:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bedtools/bedtools_genomecoveragebed/2.31.1
    label: gcov_fastan
    doc: >-
      Compute the genome coverage (max depth 1) of the fastan tandem intervals. The step
      maps over strains.
    in:
      input_type|input: fastan/output
      input_type|genome_file_opts|genome: sizes_cut/output
    state:
      input_type:
        input_type_select: bed
        genome_file_opts:
          genome_file_opts_selector: hist
      report:
        report_select: hist
        max: 1
      split: false
      strand: ''
      d: false
      dz: false
      five: false
      three: false
    position: {top: 880, left: 2550}
  gcov_union:
    tool_id: toolshed.g2.bx.psu.edu/repos/iuc/bedtools/bedtools_genomecoveragebed/2.31.1
    label: gcov_union
    doc: >-
      Compute the genome coverage (max depth 1) of the merged union intervals. The step
      maps over strains.
    in:
      input_type|input: merge_bed/output
      input_type|genome_file_opts|genome: sizes_cut/output
    state:
      input_type:
        input_type_select: bed
        genome_file_opts:
          genome_file_opts_selector: hist
      report:
        report_select: hist
        max: 1
      split: false
      strand: ''
      d: false
      dz: false
      five: false
      three: false
    position: {top: 440, left: 2550}
  masking_table:
    tool_id: toolshed.g2.bx.psu.edu/repos/richard-burhans/masking_table/masking_table/1.0.0+galaxy0
    label: masking_table
    doc: >-
      Pivot the five per-strain genomecov outputs into one Sample x masker percent-masked
      table. This tool is locally authored and reads element identifiers. The header has no
      leading '#'.
    in:
      dustmasker: gcov_dust/output
      windowmasker: gcov_window/output
      tantan: gcov_tantan/output
      fastan: gcov_fastan/output
      union: gcov_union/output
    position: {top: 360, left: 2900}
