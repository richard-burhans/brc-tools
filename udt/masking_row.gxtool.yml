# ⛔ GENERATED by scripts/build_softmask_udts.py -- do not hand-edit.
# Edit the wrapper under tools/ (the awk/Python helpers are read from there) and regenerate.
class: GalaxyUserTool
id: brc-masking-row
version: "0.2.0"
name: masking table row (BRC UDT)
description: One strain's percent-masked values, to be mapped over the genomecov collections
container: quay.io/biocontainers/python:3.12
shell_command: |
  cat > masking_table.py <<'BRC_PY'
  #!/usr/bin/env python3
  """Assemble per-strain % genome masked into a clean MultiQC custom-content table.
  
  bedtools genomecov (hist, -max 1) already did the coverage; this tool only reads
  each masker's per-strain genomecov output, picks the genome-wide depth>=1 row
  (``genome <TAB> 1 <TAB> covered_bp <TAB> genome_bp <TAB> fraction``), and pivots
  the five maskers into one matrix:
  
      Sample <TAB> dustmasker <TAB> windowmasker <TAB> tantan <TAB> fastan <TAB> union
      PvP01  <TAB> 13.63 ...
  
  The header is plain (no leading ``#``) so MultiQC custom-content reads it as a
  table rather than mis-parsing it as embedded YAML config. Inputs are passed as
  space-separated ``identifier=path`` tokens per collection (the element-identifier
  reading pattern used by collection_relabel_map).
  """
  import argparse
  
  
  def parse_pairs(tokens):
      out = {}
      for t in tokens:
          if not t:
              continue
          ident, _, path = t.partition("=")
          out[ident] = path
      return out
  
  
  def genome_masked_pct(genomecov_path):
      """Return 100 * fraction from the 'genome' depth>=1 row of a genomecov hist."""
      with open(genomecov_path) as fh:
          for line in fh:
              cols = line.rstrip("\n").split("\t")
              # chrom, depth, covered_bp, chrom_bp, fraction
              if len(cols) >= 5 and cols[0] == "genome" and cols[1] == "1":
                  return round(100.0 * float(cols[4]), 2)
      # No depth>=1 genome row => nothing masked
      return 0.0
  
  
  def main():
      ap = argparse.ArgumentParser()
      ap.add_argument("--dustmasker", nargs="*", default=[])
      ap.add_argument("--windowmasker", nargs="*", default=[])
      ap.add_argument("--tantan", nargs="*", default=[])
      ap.add_argument("--fastan", nargs="*", default=[])
      ap.add_argument("--union", nargs="*", default=[])
      ap.add_argument("--out", required=True)
      a = ap.parse_args()
  
      maskers = [
          ("dustmasker", parse_pairs(a.dustmasker)),
          ("windowmasker", parse_pairs(a.windowmasker)),
          ("tantan", parse_pairs(a.tantan)),
          ("fastan", parse_pairs(a.fastan)),
          ("union", parse_pairs(a.union)),
      ]
      cols = [name for name, _ in maskers]
  
      # Strain order follows the first non-empty masker collection.
      strains = []
      for _, mp in maskers:
          if mp:
              strains = list(mp.keys())
              break
  
      with open(a.out, "w") as out:
          out.write("Sample\t" + "\t".join(cols) + "\n")
          for strain in strains:
              vals = []
              for _, mp in maskers:
                  p = mp.get(strain)
                  vals.append(genome_masked_pct(p) if p else 0.0)
              out.write(strain + "\t" + "\t".join(f"{v:.2f}" for v in vals) + "\n")
  
  
  if __name__ == "__main__":
      main()
  BRC_PY
  set -o pipefail
  python3 masking_table.py \
    --dustmasker "s=$(inputs.dustmasker.path)" \
    --windowmasker "s=$(inputs.windowmasker.path)" \
    --tantan "s=$(inputs.tantan.path)" \
    --fastan "s=$(inputs.fastan.path)" \
    --union "s=$(inputs.union.path)" \
    --out full.tabular &&
  tail -n +2 full.tabular | cut -f2- > row.tabular
inputs:
  - name: dustmasker
    type: data
    format: tabular
    label: dustmasker genomecov for THIS strain
  - name: windowmasker
    type: data
    format: tabular
    label: windowmasker genomecov for THIS strain
  - name: tantan
    type: data
    format: tabular
    label: tantan genomecov for THIS strain
  - name: fastan
    type: data
    format: tabular
    label: fastan genomecov for THIS strain
  - name: union
    type: data
    format: tabular
    label: union genomecov for THIS strain
outputs:
  - name: output
    type: data
    format: tabular
    from_work_dir: row.tabular
    label: percent masked, one strain (values only)
help:
  format: markdown
  content: |
    ⛔ **THIS TOOL DELIBERATELY DOES NOT KNOW WHICH STRAIN IT IS PROCESSING**, and that is the whole
    design. The classic `masking_table` reads `$el.element_identifier` across five whole
    collections. The obvious port is to map one job per strain and have each read its own
    identifier as `$(inputs["<name>|__identifier__"])` -- and that WORKS when a UDT is mapped
    through the tool API, which is how it was first verified. It FAILS inside a workflow: the same
    tool, the same collection, mapped by the workflow engine instead, dies with "Error occurred
    while building command line for tool", naming nothing.

    So the sample name is supplied by Galaxy instead. `Collapse Collection` with
    `filename|add_name=true` and `place_name=same_multiple` prepends each element's IDENTIFIER to
    its lines, which is exactly the Sample column. This tool therefore emits only the numbers, and
    the header is added afterwards by `brc-masking-header`.

    ⚠ `masking_table.py` is inlined VERBATIM from `tools/masking_table/`, so the percentages are
    computed by the same code as the classic tool. The dummy `s=` key and the `tail -n +2 | cut -f2-`
    strip its header and its own Sample column; nothing about the arithmetic is reimplemented.
