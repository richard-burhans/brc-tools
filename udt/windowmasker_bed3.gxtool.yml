# ⛔ GENERATED by scripts/build_softmask_udts.py -- do not hand-edit.
# Edit the wrapper under tools/ (the awk/Python helpers are read from there) and regenerate.
#
# WHY THIS IS TWO TOOLS AND NOT ONE. The classic wrapper pipes a masker binary through
# lc_classify.py, so one job needs BOTH the masker's biocontainer and a Python interpreter. A UDT
# gets exactly one container, and quay.io/biocontainers/blast has no python3 (measured: exit 127,
# "python3: command not found").
#
# ⚠ A MULLED IMAGE WOULD FIX IT AND ITS NAME IS DERIVABLE -- an earlier version of this note said
# the opposite. galaxy.tool_util.deps.mulled.util.v2_image_name gives
# mulled-v2-21537411c4771e4e702855210543bee025cca4e0 for blast 2.17.0 + python 3.12 in one call.
# What is missing is a PUBLISHED image: neither that one nor the tantan equivalent appears among
# the 3,472 mulled-v2 images in the Galaxy depot. So the split is a workaround for a publication
# gap, not for an unknowable hash, and `planemo container_register` is the way to close it.
# Splitting costs one extra workflow step and needs no new image today.
#
# ⛔ THE MASKER TAKES THE UPPERCASED FASTA AS INPUT AND EMITS ONLY INTERVALS. `lc_classify` is
# bound to the SAME `uppercase/output` dataset the masker read -- one file by reference, not a
# second copy derived by repeating the same transformation. See build_softmask_udts.py.
class: GalaxyUserTool
id: brc-windowmasker-bed3
version: "0.5.0"
name: windowmasker -> BED3 (BRC UDT)
description: NCBI WindowMasker genome-frequency repeats, stage 1 of 2
container: quay.io/biocontainers/blast:2.17.0--h66d330f_0
requirements:
  # ⛔ MEASURED. see MASKER_MEMORY_BASIS in scripts/build_softmask_udts.py
  - type: resource
    ram_min: 16384
shell_command: |
  cat > interval2bed.awk <<'BRC_AWK'
  # NCBI dustmasker/windowmasker `-outfmt interval` -> BED3 (chrom, start, end).
  #
  # ⛔ WHY THIS FILE EXISTS AT ALL, WHEN `lc2bed.awk` ALREADY DOES THE SAME JOB. dustmasker and
  # windowmasker BOTH support `-outfmt fasta`, which emits the soft-masked sequence tantan already
  # emits -- so both maskers could take the lowercase-run route and this converter could be deleted
  # outright. That would remove a whole coordinate-convention to misread, and this file is the proof
  # that such a convention CAN be misread: see the off-by-one below.
  #
  # ⚠ IT IS KEPT ANYWAY, AND THE REDUNDANCY IS THE POINT. scripts/check_coordinates.py validates
  # THIS file's BED against the lowercase runs of the SAME tool's `-outfmt fasta` on the SAME input --
  # two independent routes out of one tool, agreeing base for base. That is the strongest coordinate
  # check in this repository, and it is what caught the off-by-one below. Move the maskers onto the
  # fasta route and the check collapses into comparing this awk against a Python reimplementation of
  # the same idea, which is exactly what the tantan case already is and is measurably weaker: it can
  # only catch a bug that one of the two implementations has and the other does not.
  #
  # So two converters is not duplication to be tidied away. Deleting either one is how you lose the
  # ability to tell whether the survivor is right.
  #
  # ⛔ THE INTERVAL FORMAT IS 0-BASED AND INCLUSIVE AT BOTH ENDS, and this file spent its whole life
  # converting it as if it were 1-based. MEASURED against dustmasker's own `-outfmt fasta` on the
  # same sequence, which is the only ground truth that settles it:
  #
  #     -outfmt interval      873 - 880          1500 - 1800
  #     lowercase runs        [873, 881)         [1500, 1801)      <- what was actually masked
  #     what this emitted     872   880          1499   1800       <- one base LEFT, right width
  #
  # `s = $1 - 1; print c, s, $2` preserves the WIDTH, which is why nothing caught it: every coverage
  # percentage, every `bedtools genomecov` column of the masking table, and
  # scripts/verify_softmask_outputs.py (which compares the union against the lowercase runs of a
  # FASTA masked from that same union) all agree with themselves. Only the POSITION is wrong -- by
  # one base, at every dustmasker and windowmasker interval in every strain. Downstream that
  # lower-cases one non-repeat base and leaves one repeat base uppercase at each boundary, and it
  # puts `lc_classify` out of phase: a `(AT)n` array was reported as `(TA)n`, a `(CAGGT)n` unit as
  # `(GTCAG)n`, and a pure polyA run at purity 997 instead of 1000.
  #
  # At a sequence start the old clamp turned the shift into a TRUNCATION: dustmasker reporting
  # `0 - 199` for a 200 bp leading repeat became `0 199`, losing one masked base outright. With the
  # correct conversion the clamp has nothing to do -- `$1` is already >= 0 -- so it is gone.
  #
  # (content for cols 4-6 is added downstream by lc_classify.py)
  BEGIN { OFS = "\t" }
  /^>/  { c = substr($1, 2); next }
  /[0-9]+ *- *[0-9]+/ { gsub(/-/, " "); print c, $1, $2 + 1 }
  BRC_AWK
  set -o pipefail
  # ⛔ `set -e` IS LOAD-BEARING HERE, NOT HOUSE STYLE. The decompress branch below writes seq.fa and
  # then assigns SRC as a SEPARATE statement -- an assignment always succeeds, so without errexit a
  # failed or truncated `gzip -cd` would leave SRC pointing at a short file and the masker would
  # mask it and exit 0. That is the exact shape of the USV failure this change removes, so it must
  # not be reintroduced by the fix for it. check_workflow_ports.py's UNCHAINED-COMMAND rule catches
  # its absence.
  set -e
  if gzip -t '$(inputs.input.path)' 2>/dev/null; then
    gzip -cd '$(inputs.input.path)' > seq.fa
    SRC=seq.fa
  else
    SRC='$(inputs.input.path)'
  fi
  windowmasker -mk_counts -in $SRC -out counts &&
  windowmasker -ustat counts -in $SRC -outfmt interval | awk -f interval2bed.awk > intervals.bed3
inputs:
  - name: input
    type: data
    format: fasta,fasta.gz
    label: Uppercased assembly FASTA
    help: the `brc-fasta-uppercase` output, plain or gzipped -- NOT a raw assembly
outputs:
  - name: intervals
    type: data
    format: bed
    from_work_dir: intervals.bed3
    label: masked intervals (BED3, unclassified)
help:
  format: markdown
  content: |
    Stage 1 of a two-step port. Emits BED3 intervals into the coordinates of the FASTA it was
    given. Feed `intervals` to `brc-lc-classify` together with THAT SAME FASTA -- the workflow
    passes `uppercase/output` to both, so the two are one dataset by reference, not two copies.
