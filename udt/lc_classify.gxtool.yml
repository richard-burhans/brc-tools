# ⛔ GENERATED by scripts/build_softmask_udts.py -- do not hand-edit.
# Edit the wrapper under tools/ (the awk/Python helpers are read from there) and regenerate.
#
# WHY THIS IS TWO TOOLS AND NOT ONE. The classic wrapper pipes a masker binary through
# lc_classify.py, so one job needs BOTH the masker's biocontainer and a Python interpreter. A UDT
# gets exactly one container, and quay.io/biocontainers/blast has no python3 (measured: exit 127,
# "python3: command not found"). A mulled image would fix it but its hash is not derivable, so
# somebody has to build and publish one. Splitting costs one extra workflow step and no new image.
#
# ⚠ THE MASKER EMITS ITS UPPERCASED FASTA AS A SECOND OUTPUT, ON PURPOSE. lc_classify reads the
# sequence to classify each interval, and it must read the SAME bases the masker saw -- same
# decompression, same uppercasing. Feeding it the original assembly instead would usually agree and
# would silently disagree wherever the two paths differ.
class: GalaxyUserTool
id: brc-lc-classify
version: "0.1.0"
name: lc_classify -> BED6 (BRC UDT)
description: Annotate masked intervals with repeat-unit signature and purity, stage 2 of 2
container: quay.io/biocontainers/python:3.12
shell_command: |
  cat > lc_classify.py <<'BRC_PY'
  #!/usr/bin/env python3
  """lc_classify.py <fasta> <bed3|-> -> BED6
  
  For each low-complexity interval, classify what it is made of so the 4th column
  carries real content instead of the (redundant) tool name:
  
    name   = repeat-unit signature: 'polyA'/'polyT'/... (period 1),
             '(AT)n'/'(AAT)n'/... (short tandem, period 2-6), or 'lc' (complex)
    score  = purity * 1000 (fraction of bases matching the best periodic consensus;
             drives UCSC grayscale), clamped 0-1000
    strand = '.'
  
  Smallest period that explains the interval well is preferred.
  """
  import sys
  
  def load_fasta(path):
      seq = {}; name = None; buf = []
      with open(path) as fh:
          for line in fh:
              if line.startswith(">"):
                  if name is not None: seq[name] = "".join(buf).upper()
                  name = line[1:].split()[0]; buf = []
              else:
                  buf.append(line.strip())
      if name is not None: seq[name] = "".join(buf).upper()
      return seq
  
  def classify(s):
      L = len(s)
      if L == 0: return "lc", 0
      best_frac = 0.0; best_unit = ""; best_p = 0
      for p in range(1, 7):
          if p > L: break
          cols = [{} for _ in range(p)]
          for i, ch in enumerate(s):
              cols[i % p][ch] = cols[i % p].get(ch, 0) + 1
          match = 0; unit = ""
          for j in range(p):
              b = max(cols[j], key=cols[j].get); unit += b; match += cols[j][b]
          frac = match / L
          if frac > best_frac + 1e-9:
              best_frac, best_unit, best_p = frac, unit, p
          if frac >= 0.85:   # smallest period that explains it well -> stop
              best_frac, best_unit, best_p = frac, unit, p
              break
      sc = int(round(best_frac * 1000))
      if best_frac < 0.60: return "lc", sc
      if best_p == 1:      return "poly" + best_unit, sc
      return "(" + best_unit + ")n", sc
  
  def main():
      seq = load_fasta(sys.argv[1])
      src = sys.stdin if (len(sys.argv) < 3 or sys.argv[2] == "-") else open(sys.argv[2])
      out = sys.stdout
      for n, line in enumerate(src, 1):
          f = line.rstrip("\n").split("\t")
          if len(f) < 3: continue
          c = f[0]; a = int(f[1]); b = int(f[2])
          # A BED naming a sequence the FASTA does not hold is a MISMATCHED PAIR of inputs, not an
          # interval to classify. Falling back to "" made classify() return ("lc", 0) and this wrote
          # a complete, well-formed, entirely wrong BED6 line and exited 0 -- and every downstream
          # check passes it: the row count is preserved, there are six columns, 0 is a legal score,
          # and "lc" is a legal signature. Nothing anywhere would notice.
          if c not in seq:
              sys.exit("lc_classify: %s line %d names sequence %r, which is not in %s. "
                       "The BED and the FASTA do not describe the same assembly."
                       % (sys.argv[2] if len(sys.argv) > 2 else "stdin", n, c, sys.argv[1]))
          if b > len(seq[c]) or a < 0 or a >= b:
              sys.exit("lc_classify: %s line %d has interval %d-%d, outside %r (length %d)."
                       % (sys.argv[2] if len(sys.argv) > 2 else "stdin", n, a, b, c, len(seq[c])))
          nm, sc = classify(seq[c][a:b])
          out.write("%s\t%d\t%d\t%s\t%d\t.\n" % (c, a, b, nm, sc))
  
  if __name__ == "__main__":
      main()
  BRC_PY
  set -o pipefail
  python3 lc_classify.py '$(inputs.fasta.path)' '$(inputs.intervals.path)' \
    | LC_ALL=C sort -k1,1 -k2,2n > annotated.bed6
inputs:
  - name: fasta
    type: data
    format: fasta
    label: Uppercased FASTA
    help: the `upper_fasta` output of the matching stage-1 masker, NOT the original assembly
  - name: intervals
    type: data
    format: bed
    label: BED3 intervals
    help: the `intervals` output of the matching stage-1 masker
outputs:
  - name: output
    type: data
    format: bed
    from_work_dir: annotated.bed6
    label: content-annotated BED6
help:
  format: markdown
  content: |
    Stage 2 of the two-step masker port, shared by dustmasker, windowmasker and tantan.

    Column 4 carries the repeat-unit signature (`polyA`, `(AT)n`, or `lc`), column 5 the purity
    x1000 driving UCSC grayscale, column 6 `.`. This is `tools/dustmasker/lc_classify.py` inlined
    verbatim, not a reimplementation.
