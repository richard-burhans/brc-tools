# ⛔ GENERATED by scripts/build_softmask_udts.py -- do not hand-edit.
# Edit the wrapper under tools/ (the awk/Python helpers are read from there) and regenerate.
class: GalaxyUserTool
id: brc-fasta-uppercase
version: "0.3.0"
name: Uppercase a FASTA (BRC UDT)
description: Optionally strip an existing soft-mask so the workflow's output is its OWN mask
container: quay.io/biocontainers/python:3.12
shell_command: |
  set -o pipefail
  python3 <<'BRC_PY'
  import gzip

  # ⛔ HEADER LINES ARE NEVER TOUCHED, AND THIS IS THE WHOLE CORRECTNESS ARGUMENT FOR THE TOOL.
  # Sequence names are CASE-SENSITIVE identifiers. Uppercasing a header rewrites the name -- `chr1`
  # becomes `CHR1` -- and every downstream join by name then silently finds nothing. A one-line
  # `tr '[:lower:]' '[:upper:]'` over the whole file does exactly that.
  src = '$(inputs.input.path)'
  with open(src, 'rb') as fh:
      gzipped = fh.read(2) == b'\x1f\x8b'
  op = (lambda p: gzip.open(p, 'rt', encoding='utf-8-sig', errors='replace')) if gzipped \
      else (lambda p: open(p, 'rt', encoding='utf-8-sig', errors='replace'))

  # ⛔ WHETHER TO STRIP IS A PARAMETER, AND THE REASON IS MEASURED. Discarding the mask an
  # assembly arrived with is NOT free downstream: on Salk_SRIb chr7 x Salk_HAWb chr7, a 1.06%
  # difference in masked bases produced 8.85% more aligned bases from LASTZ and 9.17% more
  # chained bases from axtChain -- and the effect was LARGEST in long chains, 14.6% more at
  # >= 10 kb, which is what the projection workflows actually consume. The extra alignment
  # SURVIVES chaining, so it is not repeat noise that filters itself out.
  #
  # ⚠ SO THIS IS A CHOICE BETWEEN TWO DEFENSIBLE THINGS, not a bug fix. `true` gives a
  # published FASTA whose every lower-case base is this pipeline's own, which is what makes
  # the BED tracks and the FASTA agree. `false` keeps whatever the submitter shipped, which
  # is the historical behaviour and the more conservative alignment. A workflow that picks
  # one SILENTLY is the thing worth avoiding.
  # ⛔ A TERNARY, NOT THE BARE BOOLEAN. Galaxy evaluates the dollar-parenthesis form as
  # ECMAScript, so a `type: boolean` renders LOWERCASE -- `strip = true` -- which is a NameError in
  # the Python this heredoc holds, before a single byte is written. Measured on usegalaxy.org 26.1
  # with a probe tool: the bare form rendered `true`, the ternary below rendered `True`. This is the
  # only `type: boolean` input in the repository, so nothing had ever rendered one, and neither
  # templating gate sees it: UNQUOTED-SCALAR fires only on `text`, PATH-ON-SCALAR only on a
  # `.path` tail.
  # ⚠ AND THIS COMMENT DELIBERATELY DOES NOT SPELL THE SEQUENCE OUT. Galaxy scans the WHOLE
  # shell_command, comments included: prose naming another tool's input in that form is
  # `dynamic_tool.undeclared_input_ref` and a 400 at registration, and a bare one is
  # NOT-A-GALAXY-EXPR. Both were hit while writing this note; check_udt_definitions.py catches
  # either offline, so run it after editing a comment and not only after editing code.
  strip = $(inputs.strip_existing_mask ? 'True' : 'False')

  lower = total = seqs = 0
  with op(src) as fin, open('uppercased.fasta', 'w', encoding='utf-8') as out:
      for line in fin:
          if line.startswith('>'):
              seqs += 1
              out.write(line)          # verbatim -- see above
              continue
          s = line.rstrip('\n')
          total += len(s)
          lower += sum(1 for c in s if 'a' <= c <= 'z')
          out.write(s.upper() if strip else s)
          out.write('\n')

  if seqs == 0:
      raise SystemExit('no FASTA headers found -- is this a FASTA file?')
  if total == 0:
      raise SystemExit('FASTA contains headers but no sequence')

  frac = lower / total
  print(f'sequences: {seqs:,}')
  print(f'residues:  {total:,}')
  # ⛔ THE LOG MUST SAY WHICH MODE RAN. A tool that reports "removed 462,181,305" whether or not
  # it removed anything makes the one number a reader checks meaningless, and this tool's
  # whole purpose is that the two modes produce measurably different downstream results.
  if strip:
      print(f'soft-masked residues removed: {lower:,} ({frac:.1%})')
      if lower == 0:
          print('NOTE: input carried no soft-masking; this was a no-op')
      elif frac > 0.10:
          print(f'NOTE: a substantial existing mask ({frac:.1%}) was discarded. That is '
                f'intended when strip_existing_mask is true -- the workflow re-masks from '
                f'scratch -- and is data loss anywhere else.')
  else:
      print(f'soft-masked residues KEPT: {lower:,} ({frac:.1%}) -- strip_existing_mask is '
            f'false, so the sequence passed through unchanged.')
      if lower:
          print('NOTE: the published FASTA will carry this mask AND this workflow\'s own, '
                'indistinguishably. The BED tracks report only the latter.')
  BRC_PY
inputs:
  - name: input
    type: data
    format: fasta,fasta.gz
    label: Assembly FASTA
    help: plain or gzipped; soft-masked or not
  - name: strip_existing_mask
    type: boolean
    # ⛔ DEFAULT false: THE CLASSIC WORKFLOW'S BEHAVIOUR IS THE DEFAULT. softmask.gxwf.yml masks the
    # assembly AS IT ARRIVED, so a submitter's mask survives and this pipeline's mask layers on top
    # of it. Defaulting true would have made the UDT edition quietly diverge from the classic on
    # every panel that ships soft-masked -- which is most of them, and the cannabis panel's own cs10
    # element is literally named `cs10_NCBI_RefSeq_softmasked`. Discarding the arriving mask is a
    # deliberate act with measured downstream cost (see below); it is opt-IN.
    value: false
    label: Discard the soft-mask the assembly arrived with
    help: >-
      true makes every lower-case base in the published FASTA this workflow's own, so the
      BED tracks and the FASTA agree. false keeps the submitter's mask as well. NOT a
      cosmetic choice - measured on one cannabis chromosome pair, discarding gave 8.85%
      more aligned bases and 14.6% more chains at 10 kb or longer.
outputs:
  - name: output
    type: data
    format: fasta
    from_work_dir: uppercased.fasta
    label: Uppercased FASTA
help:
  format: markdown
  content: |
    Rewrites every sequence line in uppercase -- WHEN `strip_existing_mask` is true -- and leaves
    header lines exactly as they were either way. ⚠ THE DEFAULT IS **false**, which passes the
    sequence through byte-for-byte, so the workflow masks the assembly as it ARRIVED and matches
    the classic `softmask.gxwf.yml`. Uppercasing is opt-in because discarding the arriving mask
    changes alignment measurably; the parameter's own help carries the numbers.

    ⛔ **Why the workflow needs this as a SEPARATE step even though each masker already uppercases
    internally.** The maskers uppercase their own working copy, so the BED tracks are computed on
    unmasked sequence and are correct either way. But `bedtools maskfasta -soft` was applied to the
    ORIGINAL assembly, which lowercases the union intervals *on top of whatever was already
    lowercase*. For an assembly that arrives soft-masked -- cs10 ships **46.8%** masked from NCBI
    genome-wide, which on chromosome 1 is 34.6% of all bases or **47.8% of its non-N bases**,
    while the other assemblies here are 0.0-0.7% -- the published `softmasked_fasta` was then the
    union of this workflow's mask AND NCBI's, indistinguishably -- which is still what happens
    under the default, and is why `mask_union` is published as the authoritative record of what
    this workflow masked. Feeding an UPPERCASED FASTA to `maskfasta` instead makes the published
    FASTA exactly the mask this workflow computed; that is what `strip_existing_mask: true` buys.

    **Reports which mode ran, and the fraction involved**, so a kept mask, a no-op and a discarded
    47% mask are three distinguishable lines in the job log rather than all looking like success.
