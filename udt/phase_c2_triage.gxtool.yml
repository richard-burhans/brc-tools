  cat > phase_c2_triage.py <<'BRC_PY'
  #!/usr/bin/env python3
  """
  Phase C.2 triage script — P. knowlesi orthology pipeline (Pk v1).

  For each gene projected by Liftoff, apply 8 rules to decide whether the
  projection is clean enough to accept as-is or whether it needs CESAR2
  fallback (TOGA2 in Phase C.3).

  Rules:
      R1 — frame disruption (valid_ORFs flag, CDS length % 3 != 0, internal stop)
      R2 — sequence identity below threshold (core: 0.95; family: 0.85)
      R3 — reference CDS coverage below threshold (default 0.90)
      R4 — copy-number variation for non-family genes
      R5 — partial mapping flagged by Liftoff
      R6 — non-canonical splice sites (GT-AG / AT-AC only)
      R7 — subtelomeric location (within flank_bp of chromosome end)
      R8 — known family membership (SICAvar, PIR, etc.) → force CESAR2

  Outputs (per query):
      triage.tsv           per-gene decisions and triggered rules
      needs_cesar2.bed     BED of flagged genes in reference coords
      liftoff_clean.gff3   Liftoff GFF filtered to non-flagged genes
      summary.json         counts and fallback rate

  Requires: Python 3.9+, pyfaidx
  Ported from /media/anton/data/sandbox/Pv4/v3/scripts/phase_c2_triage.py
  """

  from __future__ import annotations

  import argparse
  import csv
  import json
  import logging
  import re
  import sys
  from collections import defaultdict
  from pathlib import Path

  try:
      from pyfaidx import Fasta
  except ImportError:
      sys.exit("Missing dependency: pyfaidx.  Run inside a container that has it.")

  LOG = logging.getLogger("triage")

  STOP_CODONS = {"TAA", "TAG", "TGA"}
  CANONICAL_SPLICE = {("GT", "AG"), ("AT", "AC")}
  COMPLEMENT = str.maketrans("ACGTacgtNn", "TGCAtgcaNn")
  EXTRA_COPY_RE = re.compile(r"^(.+?)_(\d+)$")


  # ---------------------------------------------------------------------------
  # GFF parsing
  # ---------------------------------------------------------------------------

  def parse_gff_attributes(attr_str: str) -> dict:
      d = {}
      for kv in attr_str.strip().rstrip(';').split(';'):
          kv = kv.strip()
          if '=' in kv:
              k, v = kv.split('=', 1)
              d[k.strip()] = v.strip()
      return d


  class GeneRecord:
      __slots__ = ('gene_id', 'reference_id', 'chrom', 'start', 'end',
                   'strand', 'attrs', 'transcripts')

      def __init__(self, gene_id, chrom, start, end, strand, attrs):
          self.gene_id = gene_id
          self.reference_id = normalize_gene_id(gene_id, attrs)
          self.chrom = chrom
          self.start = start
          self.end = end
          self.strand = strand
          self.attrs = attrs
          self.transcripts = []


  def normalize_gene_id(gid: str, attrs: dict | None = None) -> str:
      """The reference gene this projection belongs to.

      ⛔ ASK LIFTOFF, DO NOT GUESS FROM THE NAME. This used to strip any `_<1-2 digits>` suffix on
      sight, to fold Liftoff's extra-copy names (`geneX_1`) back onto their parent -- and it cannot
      tell that from a REFERENCE GENE whose own id ends that way, which is exactly how the variant
      gene families this pipeline exists to study are named. Measured on three cleanly projected
      genes `SICAvar_1`, `SICAvar_2`, `PKNH_1400300`: the classification table came out with FOUR
      rows, inventing a reference gene `SICAvar` that appears in no BED and reporting both real
      SICAvar genes as `source=none, intactness=M` -- never projected -- while the GFF3 beside it
      said all three were projected and intact. `SICAvar_2`'s projection vanished entirely. In
      triage the same collision made `summary.json` disagree with itself: two genes flagged,
      `needs_cesar2: 1`, a 50% fallback rate for a 100% fallback, and an EMPTY `needs_cesar2.bed`
      because the invented id matched nothing in the reference.

      Liftoff states the answer outright. It writes `extra_copy_number` on every gene it projects --
      0 for the primary, >0 for a copy -- and this module already reads that attribute for rule R4
      and already writes it into `triage.tsv`. So a suffix is stripped ONLY when Liftoff says the
      gene is a copy. An annotation that carries no such attribute has no copies to fold, and its
      ids are taken as given.
      """
      try:
          copies = int(str((attrs or {}).get("extra_copy_number", "0")).strip() or "0")
      except ValueError:
          copies = 0
      if copies <= 0:
          return gid
      m = EXTRA_COPY_RE.match(gid)
      if not m:
          return gid
      core, suffix = m.group(1), m.group(2)
      if len(suffix) <= 2 and not core.endswith('_'):
          return core
      return gid


  def parse_liftoff_gff(path: Path) -> list:
      genes = {}
      tx_to_gene = {}
      tx_features: dict = defaultdict(lambda: {"exon": [], "CDS": []})

      GENE_TYPES = {"gene", "protein_coding_gene", "ncRNA_gene", "pseudogene"}
      TX_TYPES = {"mRNA", "transcript", "pseudogenic_transcript",
                  "tRNA", "rRNA", "ncRNA", "snoRNA", "snRNA"}

      with open(path) as f:
          for line in f:
              if not line.strip() or line.startswith('#'):
                  continue
              parts = line.rstrip('\n').split('\t')
              if len(parts) < 9:
                  continue
              chrom, _src, ftype, start, end, _score, strand, _phase, attr_str = parts[:9]
              attrs = parse_gff_attributes(attr_str)
              start, end = int(start), int(end)
              if ftype in GENE_TYPES:
                  gid = attrs.get("ID")
                  if not gid:
                      continue
                  genes[gid] = GeneRecord(gid, chrom, start, end, strand, attrs)
              elif ftype in TX_TYPES:
                  tx_id = attrs.get("ID")
                  parent = attrs.get("Parent")
                  if tx_id and parent:
                      tx_to_gene[tx_id] = parent
              elif ftype in ("exon", "CDS"):
                  parent = attrs.get("Parent")
                  if parent:
                      tx_features[parent][ftype].append((start, end))

      for tx_id, gid in tx_to_gene.items():
          if gid in genes:
              exons = sorted(tx_features[tx_id]["exon"])
              cdss = sorted(tx_features[tx_id]["CDS"])
              genes[gid].transcripts.append((tx_id, exons, cdss))

      return list(genes.values())


  # ---------------------------------------------------------------------------
  # Sequence helpers
  # ---------------------------------------------------------------------------

  def extract_sequence(fa, chrom, start, end, strand) -> str:
      seq = str(fa[chrom][start - 1:end]).upper()
      if strand == '-':
          seq = seq.translate(COMPLEMENT)[::-1]
      return seq


  def extract_cds(fa, chrom, cds_segments, strand) -> str:
      segs = sorted(cds_segments, reverse=(strand == '-'))
      return ''.join(extract_sequence(fa, chrom, s, e, strand) for s, e in segs)


  def has_internal_stop(cds_nt: str) -> bool:
      if len(cds_nt) % 3 != 0 or len(cds_nt) < 6:
          return False
      n_codons = len(cds_nt) // 3
      for i in range(n_codons - 1):
          if cds_nt[i * 3:(i + 1) * 3] in STOP_CODONS:
              return True
      return False


  def get_splice_sites(fa, chrom, exons, strand) -> list:
      if len(exons) < 2:
          return []
      exons_sorted = sorted(exons, reverse=(strand == '-'))
      sites = []
      for i in range(len(exons_sorted) - 1):
          if strand == '+':
              intron_start = exons_sorted[i][1] + 1
              intron_end = exons_sorted[i + 1][0] - 1
              if intron_end < intron_start + 3:
                  continue
              donor = extract_sequence(fa, chrom, intron_start, intron_start + 1, '+')
              acceptor = extract_sequence(fa, chrom, intron_end - 1, intron_end, '+')
          else:
              intron_start = exons_sorted[i + 1][1] + 1
              intron_end = exons_sorted[i][0] - 1
              if intron_end < intron_start + 3:
                  continue
              donor = extract_sequence(fa, chrom, intron_end - 1, intron_end, '-')
              acceptor = extract_sequence(fa, chrom, intron_start, intron_start + 1, '-')
          sites.append((donor, acceptor))
      return sites


  def is_subtelomeric(chrom, start, end, chrom_sizes, flank_bp) -> bool:
      size = chrom_sizes.get(chrom)
      if not size:
          return False
      return start < flank_bp or end > size - flank_bp


  # ---------------------------------------------------------------------------
  # File readers
  # ---------------------------------------------------------------------------

  def read_family_list(path) -> dict:
      fams = {}
      if not path:
          return fams
      p = Path(path)
      if not p.exists():
          LOG.warning(f"Family list not found at {p}; rule R8 will not fire")
          return fams
      with open(p) as f:
          for row in csv.reader(f, delimiter='\t'):
              if not row or row[0].startswith('#') or row[0] == 'gene_id':
                  continue
              if len(row) >= 2:
                  fams[row[0]] = row[1]
      return fams


  def read_reference_bed(path) -> dict:
      bed_lines = {}
      with open(path) as f:
          for line in f:
              if not line.strip() or line.startswith('#'):
                  continue
              parts = line.rstrip('\n').split('\t')
              if len(parts) >= 4:
                  bed_lines[parts[3]] = line
      return bed_lines


  # ---------------------------------------------------------------------------
  # Triage logic
  # ---------------------------------------------------------------------------

  def triage_gene(gene: GeneRecord, fa, chrom_sizes, family_list, args):
      triggers = []
      family_membership = family_list.get(gene.reference_id) or family_list.get(gene.gene_id)
      is_family = family_membership is not None

      # R8 — known family membership
      if is_family:
          triggers.append("R8_family")

      # R1 — frame disruption
      valid_orfs_attr = gene.attrs.get("valid_ORFs", gene.attrs.get("valid_ORF", ""))
      if valid_orfs_attr in {"0", "False", "false"}:
          triggers.append("R1a_valid_ORF_flag")

      frame_bad = False
      internal_stop = False
      for _tx_id, _exons, cdss in gene.transcripts:
          if not cdss:
              continue
          try:
              cds_nt = extract_cds(fa, gene.chrom, cdss, gene.strand)
          except (KeyError, ValueError) as e:
              LOG.debug(f"CDS extract failed for {gene.gene_id}: {e}")
              continue
          if len(cds_nt) % 3 != 0:
              frame_bad = True
          if has_internal_stop(cds_nt):
              internal_stop = True
      if frame_bad and not any(t.startswith("R1a") for t in triggers):
          triggers.append("R1b_cds_length")
      if internal_stop:
          triggers.append("R1c_internal_stop")

      # R2 — identity
      try:
          seq_id = float(gene.attrs.get("sequence_ID", "1.0"))
      except ValueError:
          seq_id = 1.0
      id_min = args.family_identity_min if is_family else args.core_identity_min
      if seq_id < id_min:
          triggers.append(f"R2_identity_{seq_id:.3f}")

      # R3 — coverage
      try:
          coverage = float(gene.attrs.get("coverage", "1.0"))
      except ValueError:
          coverage = 1.0
      if coverage < args.core_coverage_min:
          triggers.append(f"R3_coverage_{coverage:.3f}")

      # R4 — copy-number variation
      try:
          extra_copies = int(gene.attrs.get("extra_copy_number", "0"))
      except ValueError:
          extra_copies = 0
      if extra_copies > 0 and not is_family:
          triggers.append(f"R4_extra_copies_{extra_copies}")

      # R5 — partial mapping
      if gene.attrs.get("partial_mapping", "").lower() == "true":
          triggers.append("R5_partial")

      # R6 — splice-site disruption
      splice_bad = None
      for _tx_id, exons, _cdss in gene.transcripts:
          if len(exons) < 2:
              continue
          try:
              sites = get_splice_sites(fa, gene.chrom, exons, gene.strand)
          except (KeyError, ValueError):
              continue
          for donor, acceptor in sites:
              if (donor, acceptor) not in CANONICAL_SPLICE:
                  splice_bad = (donor, acceptor)
                  break
          if splice_bad:
              break
      if splice_bad:
          triggers.append(f"R6_splice_{splice_bad[0]}_{splice_bad[1]}")

      # R7 — subtelomeric
      if is_subtelomeric(gene.chrom, gene.start, gene.end, chrom_sizes, args.subtelomere_bp):
          triggers.append("R7_subtelomeric")

      return triggers, is_family, family_membership


  # ---------------------------------------------------------------------------
  # Main
  # ---------------------------------------------------------------------------

  def main():
      parser = argparse.ArgumentParser(
          description="Phase C.2 triage: decide which Liftoff-projected genes "
                      "need CESAR2 fallback (TOGA2) in Phase C.3.")
      parser.add_argument("--liftoff-gff", required=True)
      parser.add_argument("--query-fasta", required=True)
      parser.add_argument("--reference-bed", required=True)
      parser.add_argument("--family-list", default=None)
      parser.add_argument("--subtelomere-bp", type=int, default=100_000)
      parser.add_argument("--core-identity-min", type=float, default=0.95)
      parser.add_argument("--core-coverage-min", type=float, default=0.90)
      parser.add_argument("--family-identity-min", type=float, default=0.85)
      parser.add_argument("--output-dir", required=True)
      parser.add_argument("--query-name", required=True)
      parser.add_argument("--log-level", default="INFO",
                          choices=["DEBUG", "INFO", "WARNING", "ERROR"])
      args = parser.parse_args()

      logging.basicConfig(level=args.log_level,
                          format="%(asctime)s %(levelname)s %(message)s")

      outdir = Path(args.output_dir)
      outdir.mkdir(parents=True, exist_ok=True)

      LOG.info(f"Indexing query FASTA: {args.query_fasta}")
      fa = Fasta(args.query_fasta)
      chrom_sizes = {name: len(fa[name]) for name in fa.keys()}

      family_list = read_family_list(args.family_list)
      LOG.info(f"Loaded {len(family_list)} family-gene assignments")

      genes = parse_liftoff_gff(Path(args.liftoff_gff))
      LOG.info(f"Parsed {len(genes)} genes from Liftoff GFF")

      if not genes:
          LOG.error("No genes parsed — check GFF chrom names match FASTA")
          sys.exit(1)

      # ⛔ A QUERY FASTA THAT IS NOT THIS GFF'S GENOME PRODUCES OUTPUT BYTE-IDENTICAL TO A CLEAN RUN.
      # Every sequence lookup then raises KeyError, each one is swallowed per gene by design, and
      # rules R1b (CDS length), R1c (internal stop), R6 (splice sites) and R7 (subtelomeric) all
      # silently do nothing -- so every gene comes out LIFTOFF_OK. Measured: the same inputs with
      # only the FASTA's seqid changed from `chr1` to `chrX` gave all four outputs identical by md5,
      # exit 0, nothing on stderr, and a 0% fallback rate -- which emits no warning, because the only
      # rate warnings are `> 50%` and (`< 2%` AND a family list was supplied).
      #
      # This is reachable in WF-C2 by construction: triage's query_fasta and its liftoff_gff come
      # from two DIFFERENT cross products over two different pairs of collections, joined downstream
      # by POSITION. If those collections are not in the same element order, every cell is triaged
      # against another strain's genome. The script already refuses the mirror image ("No genes
      # parsed -- check GFF chrom names match FASTA"); this is the same fault from the other side.
      _gff_chroms = {g.chrom for g in genes}
      _shared = _gff_chroms & set(chrom_sizes)
      if genes and not _shared:
          LOG.error("NONE of the %d sequence name(s) in the GFF appear in the query FASTA. "
                    "GFF has %s; FASTA has %s. Every sequence-dependent rule (R1b, R1c, R6, R7) "
                    "would silently pass and every gene would be reported LIFTOFF_OK -- output "
                    "indistinguishable from a clean projection. Refusing: this is almost always the "
                    "wrong genome for this annotation.",
                    len(_gff_chroms), sorted(_gff_chroms)[:3], sorted(chrom_sizes)[:3])
          sys.exit(1)

      # ⛔ AND SHARING THE SEQUENCE NAMES IS NOT THE SAME AS BEING THE RIGHT GENOME. The check above
      # only fires when the GFF and the FASTA have NO name in common, which catches a cross-species
      # mix-up and nothing else. This pipeline's panels are strains of ONE species with identical
      # chromosome names, so a positional mis-pairing -- two independent cross products joined by
      # POSITION, which is how WF-C2 wires this tool -- shares every seqid and sails straight past it.
      # Coordinates do not: Liftoff projects ONTO the query, so a projected gene cannot extend past
      # the end of the query chromosome it was projected onto. A gene that does is proof that this
      # FASTA is not the genome these coordinates describe.
      _oob = [g for g in genes
              if g.chrom in chrom_sizes and g.end > chrom_sizes[g.chrom]]
      if _oob:
          LOG.error("%d of %d gene(s) lie beyond the end of the query sequence they are annotated "
                    "on -- e.g. %s at %s:%d-%d where %s is %d bp. Liftoff projects ONTO this genome, "
                    "so a projection cannot overrun it: this FASTA is not the assembly these "
                    "coordinates came from. Every sequence-dependent rule would read the wrong bases "
                    "and most would silently pass. Refusing.",
                    len(_oob), len(genes), _oob[0].gene_id, _oob[0].chrom, _oob[0].start,
                    _oob[0].end, _oob[0].chrom, chrom_sizes[_oob[0].chrom])
          sys.exit(1)

      ref_bed_lines = read_reference_bed(args.reference_bed)

      triage_rows = []
      flagged_ref_ids: set = set()
      clean_gene_ids: set = set()
      rule_counter: dict = defaultdict(int)

      for gene in genes:
          triggers, is_family, fam = triage_gene(gene, fa, chrom_sizes, family_list, args)
          if triggers:
              flagged_ref_ids.add(gene.reference_id)
              for t in triggers:
                  key = '_'.join(t.split('_', 2)[:2]) if '_' in t else t
                  rule_counter[key] += 1
          else:
              clean_gene_ids.add(gene.gene_id)
          triage_rows.append({
              "gene_id": gene.gene_id,
              "reference_id": gene.reference_id,
              "chrom": gene.chrom,
              "start": gene.start,
              "end": gene.end,
              "strand": gene.strand,
              "is_family": is_family,
              "family": fam or "",
              "sequence_ID": gene.attrs.get("sequence_ID", ""),
              "coverage": gene.attrs.get("coverage", ""),
              "extra_copy_number": gene.attrs.get("extra_copy_number", "0"),
              "valid_ORFs": gene.attrs.get("valid_ORFs", gene.attrs.get("valid_ORF", "")),
              "decision": "CESAR2_FALLBACK" if triggers else "LIFTOFF_OK",
              "rules_triggered": ",".join(triggers),
          })

      # Write triage.tsv
      triage_path = outdir / "triage.tsv"
      with open(triage_path, 'w', newline='') as fout:
          writer = csv.DictWriter(fout, fieldnames=list(triage_rows[0].keys()), delimiter='\t')
          writer.writeheader()
          writer.writerows(triage_rows)

      # Write needs_cesar2.bed
      cesar2_bed_path = outdir / "needs_cesar2.bed"
      n_written = n_missing = 0
      with open(cesar2_bed_path, 'w') as fout:
          for ref_id in sorted(flagged_ref_ids):
              if ref_id in ref_bed_lines:
                  fout.write(ref_bed_lines[ref_id])
                  n_written += 1
              else:
                  n_missing += 1
      LOG.info(f"BED: {n_written} written, {n_missing} flagged but missing from reference BED")

      # Write liftoff_clean.gff3
      clean_gff_path = outdir / "liftoff_clean.gff3"
      current_gene_id = None
      write_current = True
      GENE_TYPES = {"gene", "protein_coding_gene", "ncRNA_gene", "pseudogene"}
      with open(args.liftoff_gff) as fin, open(clean_gff_path, 'w') as fout:
          for line in fin:
              if not line.strip() or line.startswith('#'):
                  fout.write(line)
                  continue
              parts = line.rstrip('\n').split('\t')
              if len(parts) < 9:
                  continue
              ftype = parts[2]
              attrs = parse_gff_attributes(parts[8])
              if ftype in GENE_TYPES:
                  current_gene_id = attrs.get("ID")
                  write_current = current_gene_id in clean_gene_ids
              if write_current:
                  fout.write(line)

      # Summary
      fallback_rate = (len(flagged_ref_ids) / len(genes)) if genes else 0.0
      summary = {
          "query": args.query_name,
          "total_genes": len(genes),
          "liftoff_clean": len(clean_gene_ids),
          "needs_cesar2": len(flagged_ref_ids),
          "needs_cesar2_in_bed": n_written,
          "needs_cesar2_missing_from_bed": n_missing,
          "fallback_rate": fallback_rate,
          "rule_counts": dict(rule_counter),
          "thresholds": {
              "core_identity_min": args.core_identity_min,
              "core_coverage_min": args.core_coverage_min,
              "family_identity_min": args.family_identity_min,
              "subtelomere_bp": args.subtelomere_bp,
          },
      }
      with open(outdir / "summary.json", 'w') as fout:
          json.dump(summary, fout, indent=2, sort_keys=True)

      LOG.info(f"Triage complete for {args.query_name}: "
               f"{summary['needs_cesar2']}/{summary['total_genes']} "
               f"({fallback_rate:.1%}) flagged for CESAR2 fallback")

      if fallback_rate > 0.50:
          LOG.warning("Fallback rate exceeds 50% — triage may be too strict")
      if fallback_rate < 0.02 and len(family_list) > 0:
          LOG.warning("Fallback rate below 2% despite family list — check coverage thresholds")


  if __name__ == "__main__":
      main()
  BRC_PY
  ln -s '$(inputs.query_fasta.path)' query.fasta &&
  mkdir -p outdir &&
  python3 phase_c2_triage.py \
      --liftoff-gff '$(inputs.liftoff_gff.path)' \
      --query-fasta query.fasta \
      --reference-bed '$(inputs.reference_bed.path)' \
      --query-name '$(inputs.query_name)' \
      --output-dir outdir \
      --core-identity-min $(inputs.core_identity_min) \
      --core-coverage-min $(inputs.core_coverage_min) \
      --family-identity-min $(inputs.family_identity_min) \
      --subtelomere-bp $(inputs.subtelomere_bp) \
      $(inputs.family_list ? "--family-list '" + inputs.family_list.path + "'" : "") \
      --log-level INFO
inputs:
  - name: liftoff_gff
    type: data
    format: gff3,gff
    label: Liftoff GFF3
    help: >-
      Projected gene annotation from Liftoff. Genes must carry the attributes the triage rules
      read: sequence_ID, coverage, extra_copy_number, valid_ORFs, partial_mapping.
  - name: query_fasta
    type: data
    format: fasta
    label: Query genome FASTA
    help: >-
      The query assembly the GFF coordinates refer to; seqids must match the GFF chrom column.
      ⚠ STAGED UNDER A REAL NAME. Galaxy hands a job an extensionless `.dat`, and pyfaidx writes
      and reads its index beside the file it was given, so the tool symlinks it to `query.fasta`
      first -- exactly as the XML wrapper does.
  - name: reference_bed
    type: data
    format: bed
    label: Reference BED12
    help: >-
      Reference gene models in BED. Column 4 must carry the (normalized) gene ids, or a flagged
      gene cannot be written into needs_cesar2.bed. WF-A's anchor_prep produces this.
  - name: query_name
    type: text
    value: query
    label: Name to record for this query genome
    help: Recorded in summary.json. Letters, digits, underscore, hyphen and dot only.
    validators:
      # ⛔ AND IT MUST END IN `$`. Galaxy's RegexParameterValidatorModel uses `regex.match`, which
      # is anchored at the START ONLY -- its own docstring says so: "To enforce a match of the
      # complete value use `$` at the end of the expression." Without it only the FIRST character
      # is constrained, so a validator whose message promises "letters, digits, underscore, hyphen,
      # dot only" accepted `Pk ANKA`, `a$(id)`, `../../etc/passwd` and
      # `Pk_ANKA'; touch pwned.txt; echo '` -- and that last one made the triage job exit 0 with
      # ALL FOUR outputs missing, because the `;` cut the python invocation short of --output-dir
      # and the trailing echo became the last command in the chain. Measured against Galaxy's own
      # model. A scalar is not shlex-quoted, so the validator is the only thing standing there.
      #
      # ⚠ THE FIELD IS `expression`, NOT `regex`. The XML spelling is
      # `<validator type="regex">PATTERN</validator>`, and carrying that name over produced four
      # pydantic errors at once -- RegexParameterValidatorModel.expression missing AND `regex`
      # rejected as an extra field. Caught by galaxy-tool-util, which is the whole reason
      # check_udt_definitions.py calls the server's own model when it is installed.
      - type: regex
        message: Letters, digits, underscore, hyphen, dot only
        expression: "[A-Za-z0-9_.-]+$"
  - name: family_list
    type: data
    format: tabular
    optional: true
    label: Gene family list (optional)
    help: >-
      Optional TSV of (gene_id, family) for known variant-gene families -- SICAvar, PIR and the
      like. Supplied, rule R8 forces those genes to CESAR2 fallback and relaxes the identity
      threshold for them.
  - name: core_identity_min
    type: float
    value: 0.95
    min: 0.0
    max: 1.0
    label: Core gene minimum identity
    help: Rule R2 threshold for genes NOT on the family list.
  - name: core_coverage_min
    type: float
    value: 0.9
    min: 0.0
    max: 1.0
    label: Minimum reference CDS coverage
    help: Rule R3 threshold.
  - name: family_identity_min
    type: float
    value: 0.85
    min: 0.0
    max: 1.0
    label: Family gene minimum identity
    help: Rule R2 threshold for genes ON the family list. Ignored when no family list is given.
  - name: subtelomere_bp
    type: integer
    value: 100000
    min: 0
    label: Subtelomere flank (bp)
    help: Rule R7 flags genes within this distance of a chromosome end.
outputs:
  - name: triage_tsv
    type: data
    format: tabular
    from_work_dir: outdir/triage.tsv
    label: triage.tsv
  - name: needs_cesar2_bed
    type: data
    format: bed
    from_work_dir: outdir/needs_cesar2.bed
    label: needs_cesar2.bed
  - name: liftoff_clean_gff3
    type: data
    format: gff3
    from_work_dir: outdir/liftoff_clean.gff3
    label: liftoff_clean.gff3
  - name: summary_json
    type: data
    format: json
    from_work_dir: outdir/summary.json
    label: summary.json
help:
  format: markdown
  content: |
    Phase C.2 of the projection pipeline. Liftoff projects an anchor's genes onto a query; this
    decides which of those projections can be trusted as they are and which have to be re-projected
    by TOGA2/CESAR2 through the chain alignment.

    **Outputs.** `liftoff_clean.gff3` is the accepted subset -- the only one Phase C.4 needs for a
    Liftoff-only pass. `needs_cesar2.bed` is the reference-coordinate BED of the flagged genes,
    `triage.tsv` is the per-gene rule trace, and `summary.json` carries the counts.

    **Why a UDT.** `phase_c2_triage` is not installed on usegalaxy.org, so WF-C2 cannot be invoked
    there at all. This is the same script, in the pyfaidx biocontainer, with the file it needs
    staged under a real name.

    ⚠ A fallback rate above 50% is reported as a warning, not an error -- it usually means the
    thresholds are wrong for the clade rather than that the projection failed.
