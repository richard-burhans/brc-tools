# ⛔ GENERATED by scripts/build_softmask_udts.py -- do not hand-edit.
# Edit the wrapper under tools/ (the awk/Python helpers are read from there) and regenerate.
#
# WHY THIS IS TWO TOOLS AND NOT ONE. The classic wrapper pipes a masker binary through
# lc_classify.py, so one job needs BOTH the masker's biocontainer and a Python interpreter. A UDT
# gets exactly one container, and quay.io/biocontainers/blast has no python3 (measured: exit 127,
# "python3: command not found").
#
# ⚠ A MULLED IMAGE WOULD FIX IT AND ITS NAME IS DERIVABLE -- an earlier version of this note said
# the opposite. galaxy.tool_util.deps.mulled.util.v2_image_name gives
# mulled-v2-21537411c4771e4e702855210543bee025cca4e0 for blast 2.17.0 + python 3.12 in one call.
# What is missing is a PUBLISHED image: neither that one nor the tantan equivalent appears among
# the 3,472 mulled-v2 images in the Galaxy depot. So the split is a workaround for a publication
# gap, not for an unknowable hash, and `planemo container_register` is the way to close it.
# Splitting costs one extra workflow step and needs no new image today.
#
# ⚠ THE MASKER USED TO EMIT ITS UPPERCASED FASTA AS A SECOND OUTPUT, and the reason was sound:
# lc_classify reads the sequence to classify each interval, so it must read the SAME bases the
# masker saw. Feeding it the ORIGINAL assembly would usually agree and would silently disagree
# wherever the two paths differ -- different decompression, or a mask the masker had uppercased away.
#
# ⛔ THAT OUTPUT IS GONE, because the workflow gained `brc-fasta-uppercase` and the guard is now met
# by a file it already holds. The invariant lc_classify actually needs is the identical CONCATENATED
# SEQUENCE PER CHROMOSOME -- it joins `line.strip()` per record, so wrapping and trailing whitespace
# cannot reach it -- and both paths uppercase every sequence line while touching no header, so they
# produce it by construction rather than by coincidence. Keeping the output meant every masker wrote
# a full second copy of an assembly that was ALREADY uppercase on arrival: three copies per genome,
# ~2.4 GB on a 772 Mb genome and ~26 GB across an 11-genome panel, none of them read by anything.
# `upper.fa` is still built inside the job, because the masker binaries read it.
class: GalaxyUserTool
id: brc-dustmasker-bed3
version: "0.1.0"
name: dustmasker -> BED3 (BRC UDT)
description: NCBI symmetric-DUST low-complexity intervals, stage 1 of 2
container: quay.io/biocontainers/blast:2.17.0--h66d330f_0
shell_command: |
  cat > interval2bed.awk <<'BRC_AWK'
  # NCBI dustmasker/windowmasker `-outfmt interval` -> BED3 (chrom, start, end).
  # interval format: ">seqid" header lines, then "from - to". Start clamped to >=0.
  # (content for cols 4-6 is added downstream by lc_classify.py)
  BEGIN { OFS = "\t" }
  /^>/  { c = substr($1, 2); next }
  /[0-9]+ *- *[0-9]+/ { gsub(/-/, " "); s = $1 - 1; if (s < 0) s = 0; print c, s, $2 }
  BRC_AWK
  set -o pipefail
  { if gzip -t '$(inputs.input.path)' 2>/dev/null; then gzip -cd '$(inputs.input.path)'; else cat '$(inputs.input.path)'; fi; } \
    | awk '/^>/{print;next}{print toupper($0)}' > upper.fa &&
  dustmasker -in upper.fa -outfmt interval | awk -f interval2bed.awk > intervals.bed3
inputs:
  - name: input
    type: data
    format: fasta,fasta.gz
    label: Assembly FASTA
    help: plain or gzipped
outputs:
  - name: intervals
    type: data
    format: bed
    from_work_dir: intervals.bed3
    label: masked intervals (BED3, unclassified)
help:
  format: markdown
  content: |
    Stage 1 of a two-step port. Emits BED3 intervals over the UPPERCASED sequence -- the job
    uppercases its own working copy, so a soft-masked assembly is masked from scratch rather than
    on top of the mask it arrived with.

    Feed the intervals to `brc-lc-classify` to get the content-annotated BED6 the workflow expects,
    together with an uppercased FASTA of the same assembly. In the workflow that is the
    `brc-fasta-uppercase` step's output; run standalone, uppercase the assembly yourself. ⚠ Do NOT
    hand `brc-lc-classify` a soft-masked assembly: it classifies each interval by reading the bases
    under it, and lowercase bases are not the ones this tool measured.
