class: GalaxyUserTool
id: brc-chain-stitch-id
version: "0.1.0"
name: chainStitchId (BRC UDT)
description: join chain fragments that share the same chain id
container: quay.io/biocontainers/ucsc-chainstitchid:482--h0b57e2e_0
shell_command: |
  set -e
  ln -sf '$(inputs.input.path)' 'input.chain'
  chainStitchId 'input.chain' output.dat
inputs:
  - name: input
    type: data
    format: chain
    label: Input chain file
    help: UCSC chain-format alignment. Fragments carrying the same chain id are joined into single chains.
outputs:
  - name: output
    type: data
    format: chain
    from_work_dir: output.dat
    label: stitched chains
help:
  format: markdown
  content: |
    **chainStitchId** — join chain fragments that share the same chain id.

    A UCSC *chain* file describes gapped pairwise alignments between a target
    and a query sequence. During chaining workflows a single logical chain can
    end up split across several records that all carry the **same chain id**
    (for example after `chainNet` / `netChainSubset` style processing).
    `chainStitchId` reads the input chain file and re-joins every set of
    records that share an id into a single chain, writing the stitched result
    to a new chain file.

    ```
    chainStitchId in.chain out.chain
    ```

    -----

    **Inputs**

    - `Input chain file` — alignments in UCSC chain format.

    **Outputs**

    - `Stitched chains` — chain file in which fragments with identical ids
      have been merged.

    -----

    chainStitchId is part of Jim Kent's UCSC Genome Browser utilities
    (the chain/net alignment toolkit). It is the one chain utility not yet
    available through the IUC tool collection.
