[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexicmap-to-ucsc"
version = "0.1.0"
description = "Convert LexicMap search results (TSV) to UCSC Genome Browser tracks (BED + bedGraph)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "BRC Analytics"},
]
keywords = ["bioinformatics", "lexicmap", "ucsc", "bed", "bedgraph", "genome-browser"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.scripts]
lexicmap-to-ucsc = "lexicmap_to_ucsc.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/galaxyproject/brc-tools"
Issues = "https://github.com/galaxyproject/brc-tools/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
